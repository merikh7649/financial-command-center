/* ============================================================
   ROLLING FINANCIAL TRAJECTORY
   Periods are rolling day windows, not calendar periods:
   7 days / 30 days / 90 days / 365 days.
   ============================================================ */
const TRAJECTORY_PERIODS = {
  year:   { label:'This Year', mode:'ytd' },
  '90d':  { label:'Last 3 Months', days:90 },
  '30d':  { label:'Last Month', days:30 },
  '7d':   { label:'Last Week', days:7 }
};

function trajectoryPeriodMeta(){
  return TRAJECTORY_PERIODS[UI.trajectoryPeriod] || TRAJECTORY_PERIODS.year;
}

function balanceOnOrBefore(dateStr){
  const series = REAL_BANK_IMPORT.trajectory_daily_balances || {};
  let best = null;
  Object.keys(series).forEach(k=>{
    if(k<=dateStr && (!best || k>best)) best=k;
  });
  return best ? Number(series[best]) : null;
}

function rollingTrajectoryPoints(periodKey){
  const meta = TRAJECTORY_PERIODS[periodKey] || TRAJECTORY_PERIODS.year;
  const balances = REAL_BANK_IMPORT.trajectory_daily_balances || {};
  const today = new Date(Engine.today() + 'T00:00:00');
  const todayIso = Engine.today();
  const currentBalance = Number(REAL_BANK_IMPORT.current_balance_cents || 0);

  function iso(dt){
    return `${dt.getFullYear()}-${String(dt.getMonth()+1).padStart(2,'0')}-${String(dt.getDate()).padStart(2,'0')}`;
  }

  function balanceForDate(dt){
    const key=iso(dt);
    if(key===todayIso && Number.isFinite(currentBalance)){
      return currentBalance;
    }

    let best=null;
    Object.keys(balances).forEach(k=>{
      if(k<=key && (!best || k>best)) best=k;
    });

    if(best){
      const v=Number(balances[best]);
      return Number.isFinite(v) ? Math.round(v*100) : null;
    }

    // The bank import begins Jan 22. For earlier YTD dates, use the
    // opening balance for January rather than dropping those days.
    if(meta.mode==='ytd' && key < Object.keys(balances).sort()[0]){
      const jan = (REAL_BANK_IMPORT.monthly_balances || []).find(x=>x.year===today.getFullYear() && x.month==='JAN');
      if(jan && Number.isFinite(Number(jan.opening_cents))){
        return Number(jan.opening_cents);
      }
    }

    return null;
  }

  const points=[];
  const rawLabels=[];

  if(meta.mode==='ytd'){
    // Always Jan 1 → today, with one data point for every day.
    const startOfYear=new Date(today.getFullYear(),0,1);
    for(let dt=new Date(startOfYear); dt<=today; dt.setDate(dt.getDate()+1)){
      points.push(balanceForDate(new Date(dt)));
      rawLabels.push(iso(dt));
    }
  }else{
    const days=Number(meta.days)||7;
    const startDate=new Date(today.getTime());
    startDate.setDate(startDate.getDate()-(days-1));

    for(let dt=new Date(startDate); dt<=today; dt.setDate(dt.getDate()+1)){
      points.push(balanceForDate(new Date(dt)));
      rawLabels.push(iso(dt));
    }
  }

  // Keep all daily values; only thin the axis labels for readability.
  const n=rawLabels.length;
  const labelStep=Math.max(1,Math.ceil(n/7));
  const labels=rawLabels.map((label,i)=>{
    if(i===n-1) return 'TODAY';
    if(i===0 || i%labelStep===0){
      const d=new Date(label+'T00:00:00');
      return d.toLocaleDateString('en-US',{month:'short',day:'numeric'});
    }
    return '';
  });

  return {
    points,
    labels,
    todayIndex:points.length-1,
    currentValue:currentBalance
  };
}

function forecastPreviousCycle(){
  const current=forecastCurrentCycle();
  const previousStart=Engine.addDays(current.start,-7);

function actualCommissionPaidOn(dateStr){
  return DB.commissions
    .filter(c=>c.date===dateStr)
    .reduce((s,c)=>s+Number(c.amount_cents||0),0);
}


function reconciliationForCycle(cycleId){
  return (DB.reconciliations||[]).find(r=>r.cycle_id===cycleId) || null;
}

function reconcileCompletedCycle(cycle, forecast, actual, committedAt){
  if(!cycle || !forecast || !actual) return null;

  const variance=actual-forecast.net_cents;
  const accuracy=forecast.net_cents>0
    ? Math.max(0,Math.min(100,(1-Math.abs(variance)/forecast.net_cents)*100))
    : null;

  const existing=reconciliationForCycle(cycle.id);
  const snapshot={
    id:existing?.id || uid('rc'),
    cycle_id:cycle.id,
    cycle_start:cycle.start,
    cycle_end:cycle.end,
    payout_date:cycle.payout,
    forecast_net_cents:Number(forecast.net_cents||0),
    forecast_gross_cents:Number(forecast.gross_cents||0),
    forecast_counts:{...(forecast.counts||{})},
    forecast_actual_sales:Number(forecast.actualSales||0),
    actual_net_cents:Number(actual),
    variance_cents:Number(variance),
    accuracy,
    committed_at:existing?.committed_at || committedAt || new Date().toISOString(),
    locked:true
  };

  const idx=(DB.reconciliations||[]).findIndex(r=>r.cycle_id===cycle.id);
  if(idx>=0) DB.reconciliations[idx]=snapshot;
  else DB.reconciliations.push(snapshot);

  persist('reconciliations');
  return snapshot;
}

function forecastReconciliation(){
  const cycle=forecastPreviousCycle();
  const locked=reconciliationForCycle(cycle.id);
  const liveForecast=forecastTotals(cycle.id);

  const estimate=locked ? {
    net_cents:Number(locked.forecast_net_cents||0),
    gross_cents:Number(locked.forecast_gross_cents||0),
    counts:{...(locked.forecast_counts||{})},
    actualSales:Number(locked.forecast_actual_sales||0)
  } : liveForecast;

  const actual=locked ? Number(locked.actual_net_cents||0) : actualCommissionPaidOn(cycle.payout);
  const hasActual=locked ? true : actual>0;

  if(!hasActual) return {
    cycle,
    forecast:estimate,
    actual:0,
    hasActual:false,
    variance:null,
    accuracy:null,
    locked:false
  };

  const variance=locked
    ? Number(locked.variance_cents||0)
    : actual-estimate.net_cents;

  const accuracy=locked
    ? locked.accuracy
    : (estimate.net_cents>0
      ? Math.max(0,Math.min(100,(1-Math.abs(variance)/estimate.net_cents)*100))
      : null);

  return {cycle,forecast:estimate,actual,hasActual:true,variance,accuracy,locked:!!locked};
}

function adaptiveCommissionModel(){
  const current=forecastCurrentCycle();
  const cycles=[];

  // Learn from up to the last 12 completed commission cycles.
  for(let i=1;i<=12;i++){
    const start=Engine.addDays(current.start,-7*i);
    const cycle=forecastCycleForDate(start);
    const locked=reconciliationForCycle(cycle.id);
    const forecast=locked ? {
      net_cents:Number(locked.forecast_net_cents||0),
      gross_cents:Number(locked.forecast_gross_cents||0),
      counts:{...(locked.forecast_counts||{})},
      actualSales:Number(locked.forecast_actual_sales||0)
    } : forecastTotals(cycle.id);
    const actual=locked ? Number(locked.actual_net_cents||0) : actualCommissionPaidOn(cycle.payout);

    const sales=(DB.actualSalesEvents||[])
      .filter(e=>{
        const cycleId=e.cycle_id || forecastCycleForDate(e.date).id;
        return cycleId===cycle.id;
      })
      .reduce((s,e)=>s+Number(e.quantity||0),0);

    if(actual>0 && sales>0){
      cycles.push({
        cycle, actual, sales,
        actualPerSale:actual/sales,
        forecast:forecast.net_cents,
        forecastAccuracy:forecast.net_cents>0
          ? Math.max(0,Math.min(100,(1-Math.abs(actual-forecast.net_cents)/forecast.net_cents)*100))
          : null
      });
    }
  }

  // Most recent completed cycles carry more weight.
  let weightedRate=0, weightTotal=0;
  cycles.forEach((x,i)=>{
    const weight=Math.max(1,4-i);
    weightedRate += x.actualPerSale*weight;
    weightTotal += weight;
  });

  const historicalRate = weightTotal
    ? Math.round(weightedRate/weightTotal)
    : actualNetCommissionPerSaleCents();

  const recentAcc=cycles.filter(x=>x.forecastAccuracy!=null).slice(0,6);
  const avgAccuracy=recentAcc.length
    ? recentAcc.reduce((s,x)=>s+x.forecastAccuracy,0)/recentAcc.length
    : null;

  const variability = cycles.length>=2
    ? (() => {
        const mean=cycles.reduce((s,x)=>s+x.actualPerSale,0)/cycles.length;
        const variance=cycles.reduce((s,x)=>s+Math.pow(x.actualPerSale-mean,2),0)/cycles.length;
        return Math.sqrt(variance);
      })()
    : null;

  // Confidence starts low and increases with reconciled cycles, accuracy,
  // and stability of commission per sale.
  let confidence=cycles.length
    ? Math.min(90, 45 + cycles.length*6)
    : 25;
  if(avgAccuracy!=null) confidence += Math.max(-10,Math.min(8,(avgAccuracy-80)/5));
  if(variability!=null && historicalRate>0){
    const cv=variability/historicalRate;
    confidence -= Math.min(15,cv*50);
  }
  confidence=Math.max(20,Math.min(98,confidence));

  const biasRatios=cycles
    .filter(x=>x.forecast>0)
    .slice(0,6)
    .map(x=>x.actual/x.forecast)
    .filter(x=>Number.isFinite(x) && x>0);

  const biasRatio=biasRatios.length
    ? biasRatios.reduce((s,x)=>s+x,0)/biasRatios.length
    : 1;

  return {
    cycles,
    netPerSaleCents:historicalRate,
    averageAccuracy:avgAccuracy,
    confidence:Math.round(confidence),
    biasRatio,
    sampleSize:cycles.length,
    label:cycles.length ? 'LEARNED FROM ACTUAL CHECKS' : 'BASELINE'
  };
}

function adaptiveForecastEstimate(sales){
  const model=adaptiveCommissionModel();
  const units=Math.max(Number(sales)||0,0);
  const raw=units*model.netPerSaleCents;

  // Apply learned forecast bias only when there is at least one reconciled cycle.
  const adjusted=Math.round(raw*(model.sampleSize ? model.biasRatio : 1));

  return {
    sales:units,
    rawNetCents:Math.round(raw),
    adjustedNetCents:Math.max(0,adjusted),
    confidence:model.confidence,
    perSaleCents:model.netPerSaleCents,
    sampleSize:model.sampleSize,
    label:model.label
  };
}

function forecastProjectionModel(){
  const today=Engine.today();
  const year=Engine.d(today).getFullYear();
  const workingDays=DB.settings.working_days || [1,2,3,4,5,6];
  const annual=actualSalesProgress();
  const perSale=Math.max(actualNetCommissionPerSaleCents(),1);

  function countWorkingDays(start,end){
    let n=0;
    for(let dt=start; dt<=end; dt=Engine.addDays(dt,1)){
      if(workingDays.includes(Engine.d(dt).getDay())) n++;
    }
    return n;
  }

  const yearStart=`${year}-01-01`;
  const yearEnd=`${year}-12-31`;
  const elapsedWorkdays=Math.max(countWorkingDays(yearStart,today),1);
  const remainingWorkdays=Math.max(countWorkingDays(Engine.addDays(today,1),yearEnd),0);
  const remainingSales=annual.remaining;
  const requiredDaily=remainingWorkdays ? remainingSales/remainingWorkdays : 0;

  // We do not pretend the historical 59 sales have a dated pace. Only sales
  // entered from now forward are used as observed forward performance.
  const forwardEvents=(DB.actualSalesEvents||[]).filter(e=>e.date && e.date>=today);
  const observedForwardSales=forwardEvents.reduce((sum,e)=>sum+Number(e.quantity||0),0);

  const monthStart=Engine.startOfMonth(today);
  const elapsedMonthWorkdays=Math.max(countWorkingDays(monthStart,today),1);
  const observedMonthSales=(DB.actualSalesEvents||[])
    .filter(e=>e.date && e.date>=monthStart && e.date<=today)
    .reduce((sum,e)=>sum+Number(e.quantity||0),0);
  const observedMonthDaily=observedMonthSales/elapsedMonthWorkdays;

  // A new forecast should not swing wildly from one or two entered sales.
  // Blend observed current-month pace with the pace required to hit 120.
  const paceWeight=Math.min(observedMonthSales/5,1);
  const realisticDaily=(requiredDaily*(1-paceWeight))+(observedMonthDaily*paceWeight);
  const effectiveDaily=Math.max(realisticDaily,requiredDaily);

  const projectedRemainingSales=Math.min(
    remainingSales,
    Math.max(0,Math.round(effectiveDaily*remainingWorkdays))
  );
  const realisticSales=Math.min(annual.target,annual.current+projectedRemainingSales);
  const optimisticSales=Math.min(
    annual.target + Math.ceil(remainingWorkdays*requiredDaily*.20),
    Math.round(annual.current + effectiveDaily*1.20*remainingWorkdays)
  );
  const pessimisticSales=Math.max(
    annual.current,
    Math.round(annual.current + effectiveDaily*.80*remainingWorkdays)
  );

  const currentYearCommission=Math.max(
    0,
    DB.commissions
      .filter(c=>c.date>=yearStart && c.date<=today)
      .reduce((sum,c)=>sum+Number(c.amount_cents||0),0)
    - (REAL_BANK_IMPORT.commission_reversals||[])
      .filter(r=>r.date>=yearStart && r.date<=today)
      .reduce((sum,r)=>sum+Number(r.amount_cents||0),0)
  );

  const projectedFutureCommission=Math.max(0,(realisticSales-annual.current)*perSale);
  const realisticCommission=currentYearCommission+projectedFutureCommission;
  const optimisticCommission=currentYearCommission+Math.max(0,optimisticSales-annual.current)*perSale;
  const pessimisticCommission=currentYearCommission+Math.max(0,pessimisticSales-annual.current)*perSale;

  // Build monthly projections correctly:
  // Past months = actual.
  // Current month = actual-to-date + projection for the remaining working days,
  // using the same forward pace that drives the annual forecast.
  // Future months = allocation of the remaining annual sales after the current
  // month projection is accounted for.
  const currentMonthIndex=Engine.d(today).getMonth();
  const months=Array.from({length:12},(_,m)=>{
    const ms=`${year}-${String(m+1).padStart(2,'0')}-01`;
    const me=Engine.endOfMonth(ms);
    const isPast=m<currentMonthIndex;
    const isCurrent=m===currentMonthIndex;

    const actualGross=Engine.sumAmount(DB.commissions,ms,me);
    const actualRev=(REAL_BANK_IMPORT.commission_reversals||[])
      .filter(r=>Engine.inRange(r.date,ms,me))
      .reduce((sum,r)=>sum+Number(r.amount_cents||0),0);
    const actualNet=Math.max(actualGross-actualRev,0);

    if(isPast){
      return {
        actual:actualNet,
        projected:null,
        sales:0,
        projectedSales:0,
        monthWorkdays:0
      };
    }

    const projectionStart=isCurrent ? Engine.addDays(today,1) : ms;
    const monthWorkdays=countWorkingDays(projectionStart,me);

    return {
      actual:isCurrent?actualNet:null,
      projected:isCurrent?actualNet:null,
      sales:0,
      projectedSales:0,
      monthWorkdays
    };
  });

  // The current month is not treated as finished. Project its remaining days
  // from the current forward pace, while preserving the amount already earned.
  let salesLeft=remainingSales;
  const currentMonth=months[currentMonthIndex];

  if(currentMonth){
    const currentMonthProjectedSales=Math.min(
      salesLeft,
      Math.max(0,Math.round(effectiveDaily*currentMonth.monthWorkdays))
    );

    currentMonth.projectedSales=currentMonthProjectedSales;
    currentMonth.sales=currentMonthProjectedSales;
    currentMonth.projected=Math.max(
      currentMonth.actual||0,
      Math.round((currentMonth.actual||0)+currentMonthProjectedSales*perSale)
    );

    salesLeft=Math.max(0,salesLeft-currentMonthProjectedSales);
  }

  // Future months consume the remaining annual sales using the required annual
  // pace. This prevents the current month from being double-counted.
  const futureMonths=months.filter((m,i)=>i>currentMonthIndex && m.monthWorkdays!==undefined);
  let futureDays=futureMonths.reduce((sum,m)=>sum+m.monthWorkdays,0);

  futureMonths.forEach(m=>{
    const allocation=futureDays>0
      ? Math.min(salesLeft,Math.max(0,Math.round(salesLeft*(m.monthWorkdays/futureDays))))
      : 0;

    m.projectedSales=allocation;
    m.sales=allocation;
    m.projected=allocation*perSale;

    salesLeft=Math.max(0,salesLeft-allocation);
    futureDays=Math.max(0,futureDays-m.monthWorkdays);
  });

  // If rounding left a few sales unallocated, put them in the final projected month.
  if(salesLeft>0 && futureMonths.length){
    const future=futureMonths[futureMonths.length-1];
    future.sales+=salesLeft;
    future.projectedSales+=salesLeft;
    future.projected=(future.projected||0)+salesLeft*perSale;
  }

  const confidence=observedMonthSales>=5 ? 75 : observedMonthSales>0 ? 62 : 55;
  const labels=Array.from({length:12},(_,m)=>
    Engine.monthLabel(`${year}-${String(m+1).padStart(2,'0')}-01`,{month:'short'})
  );

  return {
    today,year,annual,perSale,elapsedWorkdays,remainingWorkdays,currentMonthIndex,
    requiredDaily,observedForwardSales,observedMonthSales,observedMonthDaily,
    realisticDaily,realisticSales,optimisticSales,pessimisticSales,
    currentYearCommission,realisticCommission,optimisticCommission,pessimisticCommission,
    confidence,months,labels
  };
}

function recurringExpenseCandidates(){
  const excluded = new Set(['Food & Dining','Gas','Miscellaneous','Ads','Reimbursements','Transport','Shopping']);
  const groups={};

  (DB.expenses||[]).forEach(e=>{
    if(!e || !e.description || excluded.has(e.category)) return;
    let key=String(e.description).toLowerCase()
      .replace(/\d+/g,'')
      .replace(/[^a-záéíóúüñ ]/g,' ')
      .replace(/\s+/g,' ')
      .trim();

    // The Revolut subscription was renamed from Premium plan fee to Metal plan fee.
    // Treat both descriptions as the same recurring expense, and use the current
    // name in the UI.
    if(key==='premium plan fee' || key==='metal plan fee'){
      key='metal plan fee';
    }

    if(!key) return;
    (groups[key] ||= []).push(e);
  });

  return Object.entries(groups).map(([key,rows])=>{
    const byMonth={};
    rows.forEach(r=>{
      const d=Engine.d(r.date);
      const mk=`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`;
      (byMonth[mk] ||= []).push(Number(r.amount_cents||0));
    });

    const months=Object.keys(byMonth);
    if(months.length<3 || rows.length<3) return null;
    if(months.some(m=>byMonth[m].length>2)) return null;

    const monthlyAmounts=months.map(m=>byMonth[m].reduce((s,v)=>s+v,0));
    const avg=monthlyAmounts.reduce((s,v)=>s+v,0)/monthlyAmounts.length;
    if(!avg) return null;

    const spread=Math.max(...monthlyAmounts)-Math.min(...monthlyAmounts);
    if(spread/avg>0.15) return null;

    const latest=[...rows].sort((a,b)=>String(a.date).localeCompare(String(b.date))).at(-1);
    const displayName = key==='metal plan fee' ? 'Metal plan fee' : latest.description;
    return {
      key, description:displayName, category:latest.category,
      monthly_cents:(key==='metal plan fee' ? 40484 : Math.round(avg)), months:months.length
    };
  }).filter(Boolean).sort((a,b)=>b.months-a.months || b.monthly_cents-a.monthly_cents);
}

function recurringGoalForKey(key){
  return (DB.goals||[]).find(g=>g.recurring===true && g.recurring_key===key);
}

function syncRecurringGoals(){
  const currentKey=monthKey(Engine.today());
  const end=Engine.endOfMonth(Engine.today());
  let changed=false;

  (DB.goals||[]).filter(g=>g.recurring===true).forEach(g=>{
    if(g.recurring_key==='premium plan fee'){
      g.recurring_key='metal plan fee';
      g.name='Metal plan fee';
      g.description='Recurring subscription';
      changed=true;
    }
    if(g.recurring===true && g.savings_strategy==='AUTOMATIC'){
      g.savings_strategy='MONTHLY';
      changed=true;
    }
    if(g.recurring_key==='metal plan fee' && Number(g.recurring_amount_cents)!==40484){
      g.recurring_amount_cents=40484;
      g.target_amount_cents=40484;
      g.monthly_contribution_cents=40484;
      g.updated_at=new Date().toISOString();
      changed=true;
    }
    if(g.recurring_cycle!==currentKey){
      // New month: recurring goal becomes a fresh monthly target.
      // The goal itself remains, but its current-month funded amount resets.
      g.target_amount_cents=Number(g.recurring_amount_cents||g.target_amount_cents||0);
      g.current_amount_cents=0;
      g.target_date=end;
      g.monthly_contribution_cents=g.target_amount_cents;
      g.recurring_cycle=currentKey;
      g.updated_at=new Date().toISOString();
      changed=true;
    }
  });
  if(changed) persist('goals');
}

function createRecurringGoal(key){
  const candidate=recurringExpenseCandidates().find(c=>c.key===key);
  if(!candidate) return;
  if(recurringGoalForKey(key)){
    showToast('Already tracking');
    return;
  }

  const now=new Date().toISOString();
  DB.goals.push({
    id:uid('gl'),
    name:candidate.description,
    category:'OTHER',
    description:`Recurring ${candidate.category || 'expense'}`,
    target_amount_cents:(candidate.key==='metal plan fee' ? 40484 : candidate.monthly_cents),
    current_amount_cents:0,
    target_date:Engine.endOfMonth(Engine.today()),
    savings_strategy:'AUTOMATIC',
    monthly_contribution_cents:(candidate.key==='metal plan fee' ? 40484 : candidate.monthly_cents),
    recurring:true,
    recurring_key:key,
    recurring_amount_cents:(candidate.key==='metal plan fee' ? 40484 : candidate.monthly_cents),
    recurring_cycle:monthKey(Engine.today()),
    created_at:now,
    updated_at:now
  });
  persist('goals');
  renderAll();
  showToast('Recurring goal created');
}

function recurringGoalSummary(){
  syncRecurringGoals();
  const recurring=(DB.goals||[]).filter(g=>g.recurring===true);
  const monthlyCommitment=recurring.reduce(
    (s,g)=>s+Number(g.recurring_amount_cents||g.target_amount_cents||0),0
  );
  const monthlyIncomeTarget=calculateMonthlyFinancialTargetCents();
  const availableAfterRecurring=Math.max(monthlyIncomeTarget-monthlyCommitment,0);

  return {
    recurring,
    monthlyCommitment,
    monthlyIncomeTarget,
    availableAfterRecurring
  };
}

function goalRank(a,b){
  const pa=GOAL_PRIORITY_META[normalizedGoalPriority(a)]?.order ?? 2;
  const pb=GOAL_PRIORITY_META[normalizedGoalPriority(b)]?.order ?? 2;
  if(pa!==pb) return pa-pb;

  const risk={BEHIND:0,'ON TRACK':1,AHEAD:2,COMPLETE:3};
  const ra=risk[a.status]??4, rb=risk[b.status]??4;
  if(ra!==rb) return ra-rb;
  return (b.pct||0)-(a.pct||0);
}

const GOAL_PRIORITY_META = {
  RECURRING: {label:'RECURRING', order:0},
  ESSENTIAL: {label:'ESSENTIAL', order:1},
  IMPORTANT: {label:'IMPORTANT', order:2},
  OPTIONAL: {label:'OPTIONAL', order:3}
};

function normalizedGoalPriority(goal){
  if(goal && goal.recurring) return 'RECURRING';
  const p=String(goal?.priority||'IMPORTANT').toUpperCase();
  return GOAL_PRIORITY_META[p] ? p : 'IMPORTANT';
}

function priorityGoalGroups(){
  const full=DB.goals.map(g=>Engine.goalFull(g,Engine.today(),DB.settings.ahead_threshold_days));
  return {
    recurring:full.filter(g=>normalizedGoalPriority(g)==='RECURRING'),
    essential:full.filter(g=>normalizedGoalPriority(g)==='ESSENTIAL'),
    important:full.filter(g=>normalizedGoalPriority(g)==='IMPORTANT'),
    optional:full.filter(g=>normalizedGoalPriority(g)==='OPTIONAL')
  };
}

function priorityGoalMonthlyNeed(goals){
  return goals
    .filter(g=>g.status!=='COMPLETE')
    .reduce((s,g)=>{
      if(g.recurring) return s+Number(g.recurring_amount_cents||g.target_amount_cents||0);
      return s+Number(g.requiredMonthlyCents||0);
    },0);
}


const USABLE_CASH_FLOOR_CENTS = 200000;

function currentUsableCash(){
  const d=derive();
  return Math.max(Number(d.available||0),0);

function weeklyGoalFundingPlan(){
  const a=prioritizedMonthlyAllocation();
  const f=monthlyGoalFundingPlan();

  const today=Engine.today();
  const monthEnd=Engine.endOfMonth(today);
  const workdays=DB.settings.working_days || [1,2,3,4,5,6];

  let workingDaysRemaining=0;
  for(let dt=today; dt<=monthEnd; dt=Engine.addDays(dt,1)){
    if(workdays.includes(Engine.d(dt).getDay())) workingDaysRemaining++;
  }
  workingDaysRemaining=Math.max(workingDaysRemaining,1);

  const weeksRemaining=Math.max(workingDaysRemaining/6,1);

  const weeklyTotal=Math.min(
    f.availableForGoalFunding / weeksRemaining,
    Math.max(a.afterRecurring,0) / weeksRemaining
  );

  const recurringWeekly=Math.min(a.recurring/weeksRemaining,weeklyTotal);
  let remaining=weeklyTotal-recurringWeekly;

  const essentialWeekly=Math.min(a.essential/weeksRemaining,remaining);
  remaining-=essentialWeekly;

  const importantWeekly=Math.min(a.important/weeksRemaining,remaining);
  remaining-=importantWeekly;

  const optionalWeekly=Math.min(a.optional/weeksRemaining,remaining);

  const rate=Math.max(actualNetCommissionPerSaleCents(),1);

  return {
    weeklyTotal,
    recurringWeekly,
    essentialWeekly,
    importantWeekly,
    optionalWeekly,
    salesNeeded:Math.ceil(weeklyTotal/rate),
    workingDaysRemaining,
    weeksRemaining
  };
}

function monthlyGoalFundingPlan(){
  const a=prioritizedMonthlyAllocation();
  const currentCash=currentUsableCash();

  // Preserve a permanent usable cash floor. Goal funding is planned only
  // from cash above that floor.
  const cashAboveFloor=Math.max(currentCash-USABLE_CASH_FLOOR_CENTS,0);
  const plannedByIncome=Math.max(a.afterRecurring,0);
  const totalAvailableForGoalFunding=Math.min(cashAboveFloor,plannedByIncome);

  const groups=[
    {key:'essential',amount:a.essential,goals:a.groups.essential},
    {key:'important',amount:a.important,goals:a.groups.important},
    {key:'optional',amount:a.optional,goals:a.groups.optional}
  ];

  let remaining=totalAvailableForGoalFunding;
  const allocation={essential:0,important:0,optional:0};

  groups.forEach(g=>{
    const take=Math.min(remaining,Math.max(g.amount,0));
    allocation[g.key]=take;
    remaining-=take;
  });

  // Recurring goals are reserved first and are not funded from discretionary
  // cash if the reserve would push usable cash below the floor.
  const recurringFunding=Math.min(a.recurring, totalAvailableForGoalFunding);
  const totalPlanned=recurringFunding+allocation.essential+allocation.important+allocation.optional;
  const remainingCashAfterPlan=Math.max(currentCash-totalPlanned,0);

  const rate=Math.max(actualNetCommissionPerSaleCents(),1);

  return {
    currentCash,
    floor:USABLE_CASH_FLOOR_CENTS,
    cashAboveFloor,
    incomeCapacity:plannedByIncome,
    availableForGoalFunding:totalAvailableForGoalFunding,
    recurringFunding,
    essentialFunding:allocation.essential,
    importantFunding:allocation.important,
    optionalFunding:allocation.optional,
    totalPlanned,
    remainingCashAfterPlan,
    salesForPlannedFunding:Math.ceil(totalPlanned/rate),
    rate
  };
}

function prioritizedMonthlyAllocation(){
  const d=derive();
  const groups=priorityGoalGroups();

  const target=d.monthlyFinancialTargetCents;
  const recurring=priorityGoalMonthlyNeed(groups.recurring);
  const essential=priorityGoalMonthlyNeed(groups.essential);
  const important=priorityGoalMonthlyNeed(groups.important);
  const optional=priorityGoalMonthlyNeed(groups.optional);

  const afterRecurring=Math.max(target-recurring,0);
  const afterEssential=Math.max(afterRecurring-essential,0);
  const afterImportant=Math.max(afterEssential-important,0);

  const rate=Math.max(actualNetCommissionPerSaleCents(),1);

  return {
    target,
    recurring, essential, important, optional,
    afterRecurring, afterEssential, afterImportant,
    salesRecurring:Math.ceil(recurring/rate),
    salesEssential:Math.ceil(essential/rate),
    salesImportant:Math.ceil(important/rate),
    salesOptional:Math.ceil(optional/rate),
    salesAll:Math.ceil((recurring+essential+important+optional)/rate),
    groups
  };
}

function monthlyGoalAllocation(){
  syncRecurringGoals();

  const d=derive();
  const goals=d.goalsFull || [];
  const recurring=goals.filter(g=>g.recurring===true);
  const discretionary=goals.filter(g=>g.recurring!==true && g.status!=='COMPLETE');

  const recurringMonthly=recurring.reduce(
    (s,g)=>s+Number(g.recurring_amount_cents||g.target_amount_cents||0),0
  );

  const otherMonthly=discretionary.reduce(
    (s,g)=>s+Number(g.requiredMonthlyCents||g.requiredMonthly||0),0
  );

  const commissionTarget=d.monthlyFinancialTargetCents;
  const afterRecurring=Math.max(commissionTarget-recurringMonthly,0);
  const afterAllGoals=Math.max(afterRecurring-otherMonthly,0);

  const rate=actualNetCommissionPerSaleCents();
  const recurringSales=rate>0 ? Math.ceil(recurringMonthly/rate) : 0;
  const otherSales=rate>0 ? Math.ceil(otherMonthly/rate) : 0;
  const totalSales=rate>0 ? Math.ceil((recurringMonthly+otherMonthly)/rate) : 0;
  const discretionarySalesCapacity=rate>0 ? Math.floor(afterRecurring/rate) : 0;

  return {
    commissionTarget,
    recurringMonthly,
    otherMonthly,
    afterRecurring,
    afterAllGoals,
    recurringSales,
    otherSales,
    totalSales,
    discretionarySalesCapacity,
    recurring,
    discretionary
  };
}

function weeklyGoalFundingExecution(){
  const planned=weeklyGoalFundingPlan();
  const weekStart=Engine.startOfWeek(Engine.today());
  const weekEnd=Engine.endOfWeek(Engine.today());

  const contributions=(DB.contributions||[])
    .filter(c=>Engine.inRange(c.date,weekStart,weekEnd));

  const totalActual=contributions.reduce((s,c)=>s+Number(c.amount_cents||0),0);

  const byGoal={};
  contributions.forEach(c=>{
    byGoal[c.goal_id]=(byGoal[c.goal_id]||0)+Number(c.amount_cents||0);
  });

  const remaining=Math.max(planned.weeklyTotal-totalActual,0);
  const pct=planned.weeklyTotal>0
    ? Math.min(totalActual/planned.weeklyTotal*100,100)
    : 100;

  return {
    planned,
    contributions,
    byGoal,
    totalActual,
    remaining,
    pct
  };
}


function goalDateAwareMetrics(goalFull){
  const g=goalFull;
  const remaining=Math.max(Number(g.remaining||0),0);
  if(remaining<=0) return {remaining:0,daysRemaining:0,requiredWeekly:0,fundedThisWeek:0,weeklyGap:0,status:'COMPLETE'};

  const today=Engine.d(Engine.today());
  const target=Engine.d(g.target_date||Engine.addMonths(Engine.today(),12));
  const daysRemaining=Math.max(Math.ceil((target-today)/(24*60*60*1000)),1);
  const weeksRemaining=Math.max(daysRemaining/7,1);
  const requiredWeekly=Math.ceil(remaining/weeksRemaining);

  const ws=Engine.startOfWeek(Engine.today());
  const we=Engine.endOfWeek(Engine.today());
  const fundedThisWeek=(DB.contributions||[])
    .filter(c=>c.goal_id===g.id && Engine.inRange(c.date,ws,we))
    .reduce((s,c)=>s+Number(c.amount_cents||0),0);

  const weeklyGap=Math.max(requiredWeekly-fundedThisWeek,0);
  const status=fundedThisWeek>=requiredWeekly?'AHEAD':'BEHIND';
  return {remaining,daysRemaining,requiredWeekly,fundedThisWeek,weeklyGap,status};
}

function nextGoalForFunding(){
  const f=weeklyGoalFundingExecution();
  const rows=DB.goals.map(g=>({
    goal:g,
    plan:goalDateAwareMetrics(Engine.goalFull(g,Engine.today(),DB.settings.ahead_threshold_days))
  })).filter(x=>x.plan.status!=='COMPLETE');

  rows.sort((a,b)=>{
    const pa=GOAL_PRIORITY_META[normalizedGoalPriority(a.goal)]?.order??2;
    const pb=GOAL_PRIORITY_META[normalizedGoalPriority(b.goal)]?.order??2;
    if(pa!==pb) return pa-pb;
    if(a.plan.status!==b.plan.status) return a.plan.status==='BEHIND'?-1:1;
    return a.plan.daysRemaining-b.plan.daysRemaining;
  });

  for(const x of rows){
    const p=x.plan;
    if(p.weeklyGap<=0) continue;
    const priority=normalizedGoalPriority(x.goal);
    let pool=0;
    if(priority==='RECURRING') pool=f.planned.recurringWeekly;
    else if(priority==='ESSENTIAL') pool=f.planned.essentialWeekly;
    else if(priority==='IMPORTANT') pool=f.planned.importantWeekly;
    else pool=f.planned.optionalWeekly;

    const amount=Math.min(pool||p.weeklyGap,p.weeklyGap);
    if(amount>0) return {goal:x.goal,amount};
  }
  return null;
}

/* ============================================================
   GOAL SALES MIX FORECAST
   Forecast-only baseline from Jan–Jul 2026 actual plan mix:
   A 24 / 41, C 1 / 41, D 2 / 41, E 7 / 41, F 7 / 41.
   Gross commission references: A 4100, C 3400, D 2400, E 1700, F 1300.
   Net forecast uses 84% because SAT is deducted before the bank deposit.
   This never changes actual banking or actual commission records.
   ============================================================ */
const SALES_MIX_FORECAST = [
  { plan:'A', share:24/41, gross_cents:410000 },
  { plan:'C', share:1/41,  gross_cents:340000 },
  { plan:'D', share:2/41,  gross_cents:240000 },
  { plan:'E', share:7/41,  gross_cents:170000 },
  { plan:'F', share:7/41,  gross_cents:130000 }
];

function goalSalesMixForecast(remainingCents){
  const remaining = Math.max(Number(remainingCents || 0), 0);
  if (!remaining) return { sales:0, grossCents:0, netCents:0, rows:[] };

  const weightedGross =
    SALES_MIX_FORECAST.reduce((s,x)=>s + x.share*x.gross_cents, 0);
  const weightedNet = weightedGross * 0.84;
  const sales = Math.max(Math.ceil(remaining / weightedNet), 0);

  // First allocate by current mix, then fix rounding by assigning the
  // remaining units to the largest-share plan.
  const allocations = SALES_MIX_FORECAST.map(x=>({
    plan:x.plan,
    count:Math.floor(sales*x.share),
    grossCents:x.gross_cents,
    share:x.share
  }));

  let used = allocations.reduce((s,x)=>s+x.count,0);
  while (used < sales){
    allocations.sort((a,b)=>b.share-a.share);
    allocations[0].count += 1;
    used += 1;
  }

  allocations.sort((a,b)=>SALES_MIX_FORECAST.findIndex(x=>x.plan===a.plan)-SALES_MIX_FORECAST.findIndex(x=>x.plan===b.plan));

  const grossCents = allocations.reduce((s,x)=>s+x.count*x.grossCents,0);
  const netCents = Math.round(grossCents*0.84);

  return {
    sales,
    grossCents,
    netCents,
    weightedGrossCents:Math.round(weightedGross),
    weightedNetCents:Math.round(weightedNet),
    rows:allocations.filter(x=>x.count>0)
  };
}


function goalSalesNeededFromCents(remainingCents){
  const rate = forecastPerSaleFromPerformance();
  if(!remainingCents || remainingCents<=0 || rate<=0) return {
    sales:0, rate, projectedNetCents:0
  };
  const sales = Math.ceil(remainingCents / rate);
  return {
    sales,
    rate,
    projectedNetCents: sales * rate
  };
}

function goalSalesPace(goalFull){
  if(!goalFull || !goalFull.remaining || goalFull.status==='COMPLETE'){
    return {salesNeeded:0, salesPerMonth:0, monthsRemaining:0};
  }

  const remainingCents = Math.max(Number(goalFull.remaining)||0,0);
  const salesCalc = goalSalesNeededFromCents(remainingCents);

  let monthsRemaining=0;
  if(goalFull.target_date){
    const today=Engine.d(Engine.today());
    const target=Engine.d(goalFull.target_date);
    monthsRemaining=Math.max(
      Math.ceil((target-today)/(30*24*60*60*1000)),
      1
    );
  }

  return {
    salesNeeded:salesCalc.sales,
    salesPerMonth:salesCalc.sales / Math.max(monthsRemaining,1),
    monthsRemaining,
    rate:salesCalc.rate,
    projectedNetCents:salesCalc.projectedNetCents
  };
}

function monthKey(dateStr){
  const d = Engine.d(dateStr || Engine.today());
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`;

function ensureMonthlyReset(){
  const key=monthKey(Engine.today());
  if(!DB.monthlySales) DB.monthlySales={};

  // A new month starts its execution counter at zero. Prior months remain
  // stored for historical charts and do not affect current-month progress.
  if(!Object.prototype.hasOwnProperty.call(DB.monthlySales,key)){
    DB.monthlySales[key]=0;
    persist('monthlySales');
  }
}

function currentMonthSales(){
  ensureMonthlyReset();

  return Math.max(0, Math.floor(Number((DB.monthlySales || {})[key] || 0)));

function addActualSaleCount(quantity){
  const qty = Math.max(1, Math.floor(Number(quantity || 1)));
  const key = monthKey(Engine.today());

  if (!DB.monthlySales) DB.monthlySales = {};
  DB.monthlySales[key] = currentMonthSales() + qty;

  // Keep dated events so weekly activity can distinguish sales by week.
  if (!Array.isArray(DB.actualSalesEvents)) DB.actualSalesEvents = [];
  DB.actualSalesEvents.push({
    id: uid('sale'),
    date: Engine.today(),
    cycle_id: forecastCurrentCycle().id,
    quantity: qty,
    created_at: new Date().toISOString()
  });

  // Annual counter is the cumulative total.
  DB.actualSales = Math.max(0, Math.floor(Number(DB.actualSales || 0))) + qty;

  persist('monthlySales');
  persist('actualSalesEvents');
  persist('actualSales');
}

function performanceAnalytics(){
  const events=Array.isArray(DB.activity)?DB.activity:[];
  const salesEvents=Array.isArray(DB.actualSalesEvents)?DB.actualSalesEvents:[];
  const usableEvents=events.filter(x=>x && x.date);

  const sums=usableEvents.reduce((a,x)=>{
    a.prospects+=Number(x.prospects||0);
    a.calls+=Number(x.calls||0);
    a.appointments+=Number(x.appointments||0);
    a.presentations+=Number(x.presentations||0);
    return a;
  },{prospects:0,calls:0,appointments:0,presentations:0});

  const actualSales=Math.max(
    salesEvents.reduce((s,e)=>s+Number(e.quantity||0),0),
    Number(DB.actualSales||0) - ACTUAL_SALES_DEFAULT
  );

  const activitySales=Math.max(
    events.reduce((s,x)=>s+Number(x.sales||0),0),
    0
  );

  // Prefer actual dated sales activity when available; otherwise use total sales added
  // since the original 59-sale baseline.
  const sales=actualSales || activitySales;

  const rates={
    prospectsPerCall:sums.calls>0 ? sums.prospects/sums.calls:null,
    callsPerAppointment:sums.appointments>0 ? sums.calls/sums.appointments:null,
    appointmentsPerPresentation:sums.presentations>0 ? sums.appointments/sums.presentations:null,
    presentationsPerSale:sales>0 ? sums.presentations/sales:null,
    prospectsPerSale:sales>0 ? sums.prospects/sales:null
  };

  const conversion={
    callRate:sums.prospects>0 ? sums.calls/sums.prospects*100:null,
    appointmentRate:sums.calls>0 ? sums.appointments/sums.calls*100:null,
    presentationRate:sums.appointments>0 ? sums.presentations/sums.appointments*100:null,
    closeRate:sums.presentations>0 ? sales/sums.presentations*100:null
  };

  // Actual commission economics.
  const netCommissionPerSale=actualNetCommissionPerSaleCents();
  const commissionTotal=DB.commissions.reduce((s,c)=>s+Number(c.amount_cents||0),0);
  const averageCommission=netCommissionPerSale;

  // Forecast accuracy from reconciled cycles.
  const cycles=(typeof forecastCycleHistory==='function') ? forecastCycleHistory(26) : [];
  const reconciled=cycles.filter(x=>x.hasActual && x.forecast && x.forecast.net_cents>0);
  const forecastAccuracy=reconciled.length
    ? reconciled.reduce((s,x)=>s+Number(x.accuracy||0),0)/reconciled.length
    : null;

  // Weekly sales pace using dated actual sales.
  const weekly={};
  salesEvents.forEach(e=>{
    if(!e.date) return;
    const dt=Engine.d(e.date);
    const start=Engine.startOfWeek(e.date);
    const key=start;
    weekly[key]=(weekly[key]||0)+Number(e.quantity||0);
  });
  const weeklyValues=Object.entries(weekly).sort((a,b)=>a[0].localeCompare(b[0])).map(x=>x[1]);
  const recentWeeks=weeklyValues.slice(-8);
  const averageWeeklySales=recentWeeks.length
    ? recentWeeks.reduce((s,v)=>s+v,0)/recentWeeks.length
    : 0;

  return {
    activityCount:usableEvents.length,
    sums,sales,rates,conversion,
    netCommissionPerSale,
    commissionTotal,
    averageCommission,
    forecastAccuracy,
    recentWeeks,
    averageWeeklySales
  };
}


function adaptiveSalesModel(){
  const p=performanceAnalytics();

  // Fixed operating baseline used until enough real data exists.
  const base={
    callRate:20/30,
    appointmentRate:10/20,
    presentationRate:5/10,
    closeRate:1/5
  };

  // Bayesian-style smoothing: actual performance gradually replaces the
  // baseline instead of allowing small samples to create wild targets.
  const smooth=(successes,attempts,priorRate,priorWeight)=>{
    if(attempts<=0) return priorRate;
    return (successes + priorRate*priorWeight) / (attempts + priorWeight);
  };

  const activitySamples={
    prospects:p.sums.prospects,
    calls:p.sums.calls,
    appointments:p.sums.appointments,
    presentations:p.sums.presentations,
    sales:p.sales
  };

  const callRate=smooth(p.sums.calls,p.sums.prospects,base.callRate,30);
  const appointmentRate=smooth(p.sums.appointments,p.sums.calls,base.appointmentRate,20);
  const presentationRate=smooth(p.sums.presentations,p.sums.appointments,base.presentationRate,10);
  const closeRate=smooth(p.sales,p.sums.presentations,base.closeRate,5);

  const enoughData =
    p.sums.calls>=30 &&
    p.sums.appointments>=15 &&
    p.sums.presentations>=10 &&
    p.sales>=5;

  return {
    enoughData,
    rates:{callRate,appointmentRate,presentationRate,closeRate},
    samples:activitySamples,

    prospectsPerCall:1/Math.max(callRate,.0001),
    callsPerAppointment:1/Math.max(appointmentRate,.0001),
    appointmentsPerPresentation:1/Math.max(presentationRate,.0001),
    presentationsPerSale:1/Math.max(closeRate,.0001),

    label:enoughData ? 'ADAPTIVE · YOUR DATA' : 'BASELINE · BUILDING DATA'
  };
}

function adaptiveActivityForSales(requiredSales){
  const m=adaptiveSalesModel();
  const sales=Math.max(Number(requiredSales)||0,0);

  const presentations=Math.ceil(sales*m.presentationsPerSale);
  const appointments=Math.ceil(presentations*m.appointmentsPerPresentation);
  const calls=Math.ceil(appointments*m.callsPerAppointment);
  const prospects=Math.ceil(calls*m.prospectsPerCall);

  return {
    sales,
    prospects,
    calls,
    appointments,
    presentations,
    mode:m.label,
    rates:m.rates
  };
}

function weeklyPerformanceReview(wS,wE,plannedSales){
  const days=Array.from({length:7},(_,i)=>Engine.addDays(wS,i));
  const activity=days.reduce((a,dt)=>{
    const x=DB.activity.find(v=>v.date===dt);
    if(x){
      a.prospects+=Number(x.prospects||0);
      a.calls+=Number(x.calls||0);
      a.appointments+=Number(x.appointments||0);
      a.presentations+=Number(x.presentations||0);
    }
    return a;
  },{prospects:0,calls:0,appointments:0,presentations:0});

  const actualSales=(DB.actualSalesEvents||[])
    .filter(e=>Engine.inRange(e.date,wS,wE))
    .reduce((s,e)=>s+Number(e.quantity||0),0);

  const plannedActivity=adaptiveActivityForSales(plannedSales);

  const actualCommission=(DB.commissions||[])
    .filter(c=>Engine.inRange(c.date,wS,wE))
    .reduce((s,c)=>s+Number(c.amount_cents||0),0);

  const expectedCommission=Math.round(plannedSales*actualNetCommissionPerSaleCents());

  return {
    planned:{
      sales:plannedSales,
      prospects:plannedActivity.prospects,
      calls:plannedActivity.calls,
      appointments:plannedActivity.appointments,
      presentations:plannedActivity.presentations,
      commission:expectedCommission
    },
    actual:{
      sales:actualSales,
      prospects:activity.prospects,
      calls:activity.calls,
      appointments:activity.appointments,
      presentations:activity.presentations,
      commission:actualCommission
    }
  };
}

function screenPlanWeekly(){
  const today = Engine.today();
  const settings = DB.settings;
  const workingDays = settings.working_days || [1,2,3,4,5,6];

  const wS = UI.weekCursor || Engine.startOfWeek(today);
  const wE = Engine.endOfWeek(wS);
  const currentWeek = wS <= today && today <= wE;

  function isWorking(dt){
    return workingDays.includes(Engine.d(dt).getDay());
  }

  const days = Array.from({length:7},(_,i)=>Engine.addDays(wS,i));
  const workingDaysInWeek = days.filter(isWorking).length;

  // Actual sales belong to the current month, not to commission deposits.
  const monthKeyNow = monthKey(today);
  const monthSales = currentMonthSales();
  const monthRemaining = Math.max(MONTHLY_SALES_TARGET - monthSales, 0);

  // Weekly sales target is derived from the 20-sale monthly target and the
  // number of working days in the current month. A normal 6-day work week
  // therefore plans around 4–5 sales, while staying consistent with the
  // monthly objective.
  const monthStart = Engine.startOfMonth(today);
  const monthEnd = Engine.endOfMonth(today);
  const monthDays = [];
  for(let d=new Date(Engine.d(monthStart)); d<=Engine.d(monthEnd); d.setDate(d.getDate()+1)){
    const iso = `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
    if(isWorking(iso)) monthDays.push(iso);
  }

  const totalWorkingDaysThisMonth = Math.max(monthDays.length,1);
  let workingDaysRemainingInMonth = monthDays.filter(dt=>dt>=today).length;
  if(!isWorking(today)) workingDaysRemainingInMonth = monthDays.filter(dt=>dt>today).length;
  workingDaysRemainingInMonth = Math.max(workingDaysRemainingInMonth,1);

  const weeklyTarget = Math.max(
    0,
    Math.ceil((monthRemaining / workingDaysRemainingInMonth) * workingDaysInWeek)
  );

  const dailySalesTarget = 1;
  const weeklyBaselineTarget = Math.max(workingDaysInWeek * dailySalesTarget, 0);

  // Adaptive weekly plan. The monthly/annual pace determines the sales
  // requirement; the real funnel determines the activity required.
  const plannedWeeklySales = currentWeek ? Math.max(weeklyTarget, weeklyBaselineTarget) : weeklyTarget;
  const adaptiveWeeklyActivity = adaptiveActivityForSales(plannedWeeklySales);

  // Count only manually recorded actual sales. We don't infer sales from
  // commission cash deposits.
  const weekActualSales = currentWeek

        .filter(e=>Engine.inRange(e.date,wS,wE))

  const weekGoal = plannedWeeklySales;

  const review = weeklyPerformanceReview(

  const nextWeekTarget = Math.max(nextWeekBase, nextWeekBase+nextWeekCarryover);
  const nextWeekAdaptive = adaptiveActivityForSales(nextWeekTarget);

  const activityByDay = days.map(dt=>{
    const a = DB.activity.find(x=>x.date===dt);

const ANNUAL_SALES_TARGET = 120;
const CURRENT_ANNUAL_SALES = 0;

function annualSalesProgress(){
  const current = Math.max(0, Math.floor(Number(DB.actualSales ?? CURRENT_ANNUAL_SALES)));
  const remaining = Math.max(ANNUAL_SALES_TARGET - current, 0);
  const today = Engine.d(Engine.today());
  const end = Engine.d(`${today.getFullYear()}-12-31`);

  let workdaysRemaining = 0;
  for(let d = new Date(today); d <= end; d.setDate(d.getDate()+1)){
    if((DB.settings.working_days || [1,2,3,4,5,6]).includes(d.getDay())){
      workdaysRemaining++;
    }
  }

  const salesPerDay = workdaysRemaining ? remaining / workdaysRemaining : remaining;
  const salesPerWeek = salesPerDay * 6;

  return {
    target: ANNUAL_SALES_TARGET,
    current,
    remaining,
    pct: ANNUAL_SALES_TARGET ? CURRENT_ANNUAL_SALES / ANNUAL_SALES_TARGET * 100 : 0,
    workdaysRemaining,
    salesPerDay,
    salesPerWeek
  };
}

  const monthStart = Engine.startOfMonth(today);
  const monthEnd = Engine.endOfMonth(today);
  const workingDays = (DB.settings.working_days || [1,2,3,4,5,6]);

  function isWorkday(dt){
    return workingDays.includes(Engine.d(dt).getDay());
  }

  const monthWorkingDays = [];
  for(let d0=new Date(Engine.d(monthStart)); d0<=Engine.d(monthEnd); d0.setDate(d0.getDate()+1)){
    const iso=`${d0.getFullYear()}-${String(d0.getMonth()+1).padStart(2,'0')}-${String(d0.getDate()).padStart(2,'0')}`;
    if(isWorkday(iso)) monthWorkingDays.push(iso);
  }

  const remainingWorkingDays = Math.max(
    monthWorkingDays.filter(dt=>dt>=today).length,
    1
  );

  const salesPerDayNeeded = salesRemaining / remainingWorkingDays;
  const salesPerWeekNeeded = salesPerDayNeeded * 6;

  const weekStarts = Engine.calendarWeeksForMonth(today);
  const curWeekIdx = weekStarts.reduce((best,ws,i)=> today>=ws ? i : best, 0);

function screenPlanActivity(){
  const today = Engine.today();
  const workingDays = DB.settings.working_days || [1,2,3,4,5,6];
  const wS = UI.weekCursor || Engine.startOfWeek(today);
  const wE = Engine.endOfWeek(wS);
  const days = Array.from({length:7},(_,i)=>Engine.addDays(wS,i));
  const workdays = days.filter(dt=>workingDays.includes(Engine.d(dt).getDay()));

  const monthlyActual = currentMonthSales();
  const monthlyRemaining = Math.max(MONTHLY_SALES_TARGET - monthlyActual, 0);

  // Monthly required pace.
  const monthEnd = Engine.endOfMonth(today);
  let monthWorkdaysRemaining = 0;
  for(let dt=today; dt<=monthEnd; dt=Engine.addDays(dt,1)){
    if(workingDays.includes(Engine.d(dt).getDay())) monthWorkdaysRemaining++;
  }
  monthWorkdaysRemaining = Math.max(monthWorkdaysRemaining,1);
  const monthlySalesPerDay = monthlyRemaining / monthWorkdaysRemaining;

  // Annual required pace toward 120.
  const annual = actualSalesProgress();
  const yearEnd = `${Engine.d(today).getFullYear()}-12-31`;
  let annualWorkdaysRemaining = 0;
  for(let dt=today; dt<=yearEnd; dt=Engine.addDays(dt,1)){
    if(workingDays.includes(Engine.d(dt).getDay())) annualWorkdaysRemaining++;
  }
  annualWorkdaysRemaining = Math.max(annualWorkdaysRemaining,1);
  const annualSalesPerDay = annual.remaining / annualWorkdaysRemaining;

  // Use the stricter of the annual and current-month pace.
  const requiredSalesPerDay = Math.max(monthlySalesPerDay, annualSalesPerDay);
  const requiredSalesPerDayRounded = Math.ceil(requiredSalesPerDay);

  // Fixed operating conversion standard:
  // 30 prospects -> 20 calls -> 10 appointments -> 5 pitches -> 1 sale.
  const dailyStandard = {
    prospects:30,
    calls:20,
    appointments:10,
    presentations:5,
    sales:1
  };

  const adaptiveToday=adaptiveActivityForSales(requiredSalesPerDayRounded);
  const dailyRequired = {
    prospects:adaptiveToday.prospects,
    calls:adaptiveToday.calls,
    appointments:adaptiveToday.appointments,
    presentations:adaptiveToday.presentations,
    sales:adaptiveToday.sales
  };

  // Weekly targets adapt to the number of working days left in the selected week.
  const isCurrentWeek = wS <= today && today <= wE;
  const remainingWorkdaysThisWeek = days.filter(dt=>{
    return workingDays.includes(Engine.d(dt).getDay()) && (isCurrentWeek ? dt>=today : true);
  }).length;
  const weekTargetDays = Math.max(remainingWorkdaysThisWeek,1);

  const targets = {
    prospects:dailyRequired.prospects * weekTargetDays,
    calls:dailyRequired.calls * weekTargetDays,
    appointments:dailyRequired.appointments * weekTargetDays,
    presentations:dailyRequired.presentations * weekTargetDays,
    sales:dailyRequired.sales * weekTargetDays
  };

  const done = days.reduce((acc,dt)=>{
    const a=DB.activity.find(x=>x.date===dt);
    if(a){
      acc.prospects += Number(a.prospects||0);
      acc.calls += Number(a.calls||0);
      acc.appointments += Number(a.appointments||0);
      acc.presentations += Number(a.presentations||0);
    }
    return acc;
  },{prospects:0,calls:0,appointments:0,presentations:0});

  const doneSales = (DB.actualSalesEvents || [])
    .filter(e=>Engine.inRange(e.date,wS,wE))
    .reduce((s,e)=>s+Number(e.quantity||0),0);

  function pct(v,t){ return t>0 ? Math.min(v/t*100,100) : 0; }

  const d = UI.activityDraft || {prospects:0,calls:0,appointments:0,presentations:0};

  const metricEditor = (key,label,icon) => `
    <div class="activity-editor-row">
      <div class="activity-editor-icon">${icon}</div>
      <div class="activity-editor-label">${label}</div>
      <button class="activity-step-btn" data-action="activity-minus" data-metric="${key}">−</button>
      <div class="activity-step-value">${Number(d[key]||0)}</div>
      <button class="activity-step-btn" data-action="activity-plus" data-metric="${key}">+</button>
    </div>`;

  return `
  <div class="screen" style="padding-top:50px;">
    ${PageHeader('PLAN', 'ACTIVITY PLAN')}
    ${planSubTabs('activity')}

    <div class="card section-gap">
      <div class="label label-gold">REQUIRED TODAY</div>
      <div class="row" style="margin-top:14px;text-align:center;">
        <div style="flex:1;"><div class="value-md">${dailyRequired.prospects}</div><div class="tiny">PROSPECTS</div></div>
        <div style="flex:1;"><div class="value-md">${dailyRequired.calls}</div><div class="tiny">CALLS</div></div>
        <div style="flex:1;"><div class="value-md">${dailyRequired.appointments}</div><div class="tiny">APPTS</div></div>
        <div style="flex:1;"><div class="value-md">${dailyRequired.presentations}</div><div class="tiny">PITCHES</div></div>
        <div style="flex:1;"><div class="value-md gold">${dailyRequired.sales}</div><div class="tiny">SALES</div></div>
      </div>
      <div class="row" style="margin-top:10px;">
        <span class="tiny sans">MONTHLY ${monthlyActual}/${MONTHLY_SALES_TARGET}</span>
        <span class="tiny sans">ANNUAL ${annual.current}/${annual.target}</span>
      </div>
    </div>

    ${adaptiveForecastCard(requiredSalesPerDayRounded)}

    <div class="card section-gap">
      <div class="row">
        <span class="label label-gold">THIS WEEK</span>
        <span class="tiny sans">${shortDate(wS)} – ${shortDate(wE)}</span>
      </div>
      <div class="row" style="margin-top:14px;text-align:center;">
        <div style="flex:1;"><div class="value-md">${targets.prospects}</div><div class="tiny">PROSPECTS</div></div>
        <div style="flex:1;"><div class="value-md">${targets.calls}</div><div class="tiny">CALLS</div></div>
        <div style="flex:1;"><div class="value-md">${targets.appointments}</div><div class="tiny">APPTS</div></div>
        <div style="flex:1;"><div class="value-md">${targets.presentations}</div><div class="tiny">PITCHES</div></div>
        <div style="flex:1;"><div class="value-md gold">${targets.sales}</div><div class="tiny">SALES</div></div>
      </div>
      <div class="tiny sans" style="margin-top:9px;">${weekTargetDays} working day${weekTargetDays===1?'':'s'} in the active target window</div>
    </div>

    <div class="card section-gap activity-input-card">
      <div class="row" style="cursor:pointer;" data-action="toggle-activity-editor">
        <div>
          <div class="label label-gold">RECORDED ACTIVITY</div>
          <div class="tiny sans" style="margin-top:5px;">Tap to ${UI.activityExpanded ? 'close' : 'add'} today's activity</div>
        </div>
        <div class="activity-expand-mark">${UI.activityExpanded ? '−' : '+'}</div>
      </div>

      ${UI.activityExpanded ? `
      <div class="activity-editor">
        <div class="tiny sans activity-editor-date">TODAY · ${shortDate(today)}</div>
        ${metricEditor('prospects','PROSPECTS',Icon.people)}
        ${metricEditor('calls','CALLS',Icon.phone)}
        ${metricEditor('appointments','APPOINTMENTS',Icon.calendar)}
        ${metricEditor('presentations','PITCHES',Icon.presentation)}

        <button class="btn btn-primary activity-save-btn" data-action="save-activity-today">
          SAVE TODAY'S ACTIVITY ${Icon.chevronRight}
        </button>
      </div>` : ''}
    </div>

    <div class="card section-gap">
      <div class="label label-gold">WEEKLY PROGRESS</div>
      ${[
        ['prospects','PROSPECTS'],['calls','CALLS'],['appointments','APPOINTMENTS'],
        ['presentations','PITCHES']
      ].map(([key,label])=>`
        <div style="margin-top:12px;">
          <div class="row">
            <span class="tiny sans">${label}</span>
            <span class="tiny sans">${done[key]} / ${targets[key]}</span>
          </div>
          <div style="margin-top:6px;">${ProgressBar(pct(done[key],targets[key]),'gold')}</div>
        </div>
      `).join('')}
      <div style="margin-top:12px;">
        <div class="row">
          <span class="tiny sans">SALES</span>
          <span class="tiny sans">${doneSales} / ${targets.sales}</span>
        </div>
        <div style="margin-top:6px;">${ProgressBar(pct(doneSales,targets.sales),'green')}</div>
      </div>
    </div>

    <div class="card section-gap">
      <div class="label label-gold">CONVERSION STANDARD</div>
      <div class="row" style="margin-top:14px;text-align:center;">
        <div style="flex:1;"><div class="value-md">30</div><div class="tiny">PROSPECTS</div></div>
        <div style="flex:1;"><div class="value-md">20</div><div class="tiny">CALLS</div></div>
        <div style="flex:1;"><div class="value-md">10</div><div class="tiny">APPTS</div></div>
        <div style="flex:1;"><div class="value-md">5</div><div class="tiny">PITCHES</div></div>
        <div style="flex:1;"><div class="value-md gold">1</div><div class="tiny">SALE</div></div>
      </div>
    </div>

    <div class="card section-gap">
      <div class="label label-gold">DAILY BREAKDOWN</div>
      <div class="sans" style="margin-top:10px;overflow-x:auto;">
        <table style="width:100%;border-collapse:collapse;font-size:12px;">
          <tr class="tiny"><td>DAY</td><td>P</td><td>C</td><td>A</td><td>PR</td><td>S</td></tr>
          ${days.map(dt=>{
            const a=DB.activity.find(x=>x.date===dt);
            const work=workingDays.includes(Engine.d(dt).getDay());
            const salesForDay=(DB.actualSalesEvents || [])
              .filter(e=>e.date===dt)
              .reduce((s,e)=>s+Number(e.quantity||0),0);
            return `<tr style="border-top:1px solid var(--border);opacity:${work?1:.45};">
              <td style="padding:8px 0;">${Engine.weekdayLabel(dt)} ${Engine.d(dt).getDate()}</td>
              <td>${a?.prospects??'—'}</td>
              <td>${a?.calls??'—'}</td>
              <td>${a?.appointments??'—'}</td>
              <td>${a?.presentations??'—'}</td>
              <td>${salesForDay || '—'}</td>
            </tr>`;
          }).join('')}
        </table>
      </div>
    </div>
    ${performanceAnalyticsCard()}
    </div>`;
}

function screenPlanCalendar(){
  const cursor = UI.calendarCursor;
  const monthStart = Engine.startOfMonth(cursor), monthEnd = Engine.endOfMonth(cursor);
  const firstDow = (Engine.d(monthStart).getDay()+6)%7; // Monday=0
  const daysInMonth = Engine.d(monthEnd).getDate();
  const cells = [];
  for(let i=0;i<firstDow;i++) cells.push(null);
  for(let day=1; day<=daysInMonth; day++) cells.push(`${monthStart.slice(0,8)}${String(day).padStart(2,'0')}`);
  const dayNames = ['MON','TUE','WED','THU','FRI','SAT','SUN'];

  function dataFor(dt){
    const c = Engine.sumAmount(DB.commissions, dt, dt);
    const e = Engine.sumAmount(DB.expenses, dt, dt);
    const acts = DB.activity.filter(a=>a.date===dt).length;
    return { c, e, acts, has: c>0||e>0||acts>0 };
  }
  const upcoming = [];
  if (DB.settings.monthly_target_cents) upcoming.push({ name:'Monthly Target Deadline', date: Engine.endOfMonth(Engine.today()), note: money(DB.settings.monthly_target_cents)+' target' });
  DB.goals.filter(g=>g.target_date>=Engine.today()).sort((a,b)=>a.target_date.localeCompare(b.target_date)).slice(0,3).forEach(g=>{
    upcoming.push({ name: g.name+' deadline', date:g.target_date, note:'Goal target date' });
  });
  upcoming.sort((a,b)=>a.date.localeCompare(b.date));

  return `
  <div class="screen" style="padding-top:50px;">
    ${PageHeader('PLAN', 'CALENDAR')}
    ${planSubTabs('calendar')}
    <div class="card section-gap">
      <div class="row"><span class="tiny sans">${Engine.monthLabel(cursor,{month:'long',year:'numeric'})}</span>
        <div style="display:flex;gap:8px;"><span class="icon-btn" style="width:30px;height:30px;" data-action="cal-prev">‹</span><span class="icon-btn" style="width:30px;height:30px;" data-action="cal-next">›</span></div>
      </div>
      <div class="sans" style="display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-top:14px;">
        ${dayNames.map(n=>`<div class="tiny" style="text-align:center;">${n}</div>`).join('')}
        ${cells.map(dt=>{
          if (!dt) return `<div></div>`;
          const dd = dataFor(dt);
          const isToday = dt===Engine.today();
          return `<div style="text-align:center;padding:6px 2px;border-radius:8px;${isToday?'border:1px solid var(--gold);':''}">
            <div style="font-size:12px;color:${dd.has?'var(--ivory)':'var(--muted)'};">${Engine.d(dt).getDate()}</div>
            ${dd.has?`<div class="dot" style="background:var(--gold);margin:3px auto 0;"></div>`:''}
          </div>`;
        }).join('')}
      </div>
    </div>
    <div class="card section-gap">
      <div class="label label-gold">UPCOMING</div>
      ${upcoming.length ? `<div class="stack" style="margin-top:8px;">
        ${upcoming.map(u=>`<div class="list-item"><div class="list-icon">${Icon.flag}</div>
          <div style="flex:1;"><div class="sans" style="font-size:14px;color:var(--ivory);">${esc(u.name)}</div><div class="tiny">${u.note}</div></div>
          <div class="tiny">${shortDate(u.date)}</div></div>`).join('')}
      </div>` : EmptyState('Nothing scheduled','Set goal dates or a monthly target to see them here.', Icon.calendar)}
    </div>
  </div>`;
}

function archiveCommissions(year){
  const list = DB.commissions.filter(c=>c.date.startsWith(year)).sort((a,b)=>b.date.localeCompare(a.date));
  const total = Math.max(
      list.reduce((s,c)=>s+c.amount_cents,0)
      - (REAL_BANK_IMPORT.commission_reversals||[])
          .filter(r=>String(r.date).startsWith(year))
          .reduce((s,r)=>s+r.amount_cents,0),
      0
    );
  return `
  <div class="section-gap row"><span class="value-md">${year}</span></div>
  <div class="stack section-gap">
    ${list.length ? list.map(c=>`
      <div class="card" style="display:flex;justify-content:space-between;align-items:center;">
        <div><div class="tiny">${medDate(c.date)}</div><div class="value-md" style="margin-top:2px;">${money(c.amount_cents)}</div></div>
        <span class="badge badge-gold">DEPOSITED</span>
      </div>`).join('') : EmptyState('No commissions yet','Your first Wednesday will start the record.', Icon.money)}
  </div>
  ${list.length ? `<div class="card section-gap">
    <div class="row"><div><div class="label label-gold">TOTAL COMMISSIONS</div><div class="value-lg">${money(total)}</div><div class="tiny">${year}</div></div>${Icon.plan}</div>
  </div>` : ''}`;
}
function archiveSpending(year){
  const list = DB.expenses.filter(e=>e.date.startsWith(year)).sort((a,b)=>b.date.localeCompare(a.date));
  const total = list.reduce((s,e)=>s+e.amount_cents,0);
  return `
  <div class="section-gap row"><span class="value-md">${year}</span></div>
  <div class="stack section-gap">
    ${list.length ? list.map(e=>`
      <div class="card" style="display:flex;justify-content:space-between;align-items:center;">

function keypadPush(val){
  if (val==='.'){ if (UI.keypadValue.includes('.')) return; if(UI.keypadValue==='') { UI.keypadValue='0.'; return; } UI.keypadValue += '.'; return; }
  const decIdx = UI.keypadValue.indexOf('.');
  if (decIdx>=0 && UI.keypadValue.length - decIdx > 2) return; // max 2 decimals
  if (UI.keypadValue.replace('.','').length >= 9) return; // sane cap
  if (UI.keypadValue==='0') { UI.keypadValue = val; return; }
  UI.keypadValue += val;
}
function keypadBack(){ UI.keypadValue = UI.keypadValue.slice(0,-1); }

function dataContractReport(){
  const issues=[];

  // Annual sales: cumulative only.
  if(Number(DB.actualSales||0)<0) issues.push('negative annual sales');
  if(!Array.isArray(DB.actualSalesEvents)) issues.push('sales events missing');

  // Monthly sales: keyed by YYYY-MM; no cumulative overwrite.
  Object.keys(DB.monthlySales||{}).forEach(k=>{
    if(!/^\d{4}-\d{2}$/.test(k)) issues.push('invalid monthly sales key');
    if(Number(DB.monthlySales[k]||0)<0) issues.push('negative monthly sales');
  });

  // Activity: one record per day.
  const activityDates=(DB.activity||[]).map(a=>a.date);
  if(new Set(activityDates).size!==activityDates.length) issues.push('duplicate activity date');

  // Goals: monetary values are cents and non-negative.
  (DB.goals||[]).forEach(g=>{
    if(Number(g.current_amount_cents||0)<0 || Number(g.target_amount_cents||0)<0){
      issues.push('negative goal amount');
    }
    if(g.recurring && g.savings_strategy==='AUTOMATIC') issues.push('legacy automatic goal');
  });

  return {ok:issues.length===0,issues};
}

function systemIntegrityReport(){
  const issues=[];

  if(ANNUAL_SALES_TARGET<59) issues.push('annual target invalid');
  if(MONTHLY_SALES_TARGET!==20) issues.push('monthly sales target invalid');
  if(USABLE_CASH_FLOOR_CENTS!==200000) issues.push('cash floor invalid');

  (DB.goals||[]).forEach(g=>{
    if(g.recurring && g.savings_strategy==='AUTOMATIC') issues.push('obsolete automatic goal strategy');
    if(g.recurring && Number(g.recurring_amount_cents||0)<0) issues.push('negative recurring goal');
    if(!g.recurring && !['WEEKLY','MONTHLY'].includes(String(g.savings_strategy||'WEEKLY').toUpperCase())){
      issues.push('invalid custom goal frequency');
    }
  });

  (DB.reconciliations||[]).forEach(r=>{
    if(r.locked!==true) issues.push('unlocked reconciliation');
    if(r.forecast_net_cents<0 || r.actual_net_cents<0) issues.push('negative reconciliation');
  });

  return {ok:issues.length===0,issues};
}

function renderAll(opts={}){

  }
}

async function handleAction(action, ds, evt){
  if (UI.overlay==='expense' && UI.expenseDetailsOpen){

  }
  switch(action){
    case 'trajectory-period-toggle':

      break;

    case 'trajectory-period-select':
      UI.trajectoryPeriod = TRAJECTORY_PERIODS[ds.period] ? ds.period : 'year';
      UI.trajectoryMenuOpen = false;
      renderAll({resetScroll:false, scrollActiveTab:false});
      break;

    /* ---- navigation ---- */
    case 'nav': {
      const map = { command:'command', money:'money', forecast:'forecast', goals:'goals', plan:'plan', archive:'archive',
        'goals-all':'goals-all', 'plan-weekly':'plan-weekly', 'plan-sales':'plan-sales', 'plan-activity':'plan-activity', 'plan-calendar':'plan-calendar' };
      goTo(map[ds.route] || ds.route, {}, {replace:false});
      break;
    }
    case 'nav-back': {
      if (UI.route.name==='goal-new' && UI.goalWizard.step>1){
        syncWizardInputs();
        UI.goalWizard.step -= 1;
        renderAll();
      } else {
        goBack();
      }
      break;
    }
    case 'open-goal': goTo('goal', { id: ds.id }); UI.goalDetailTab='overview'; break;
    case 'new-goal': UI.goalWizard = { step:1, draft:newGoalDraft() }; goTo('goal-new'); break;
    case 'goals-filter': UI.goalsFilter = ds.cat; renderAll(); break;
    case 'goal-tab': UI.goalDetailTab = ds.tab; renderAll(); break;
    case 'plan-tab': {
      const map = { weekly:'plan-weekly', sales:'plan-sales', activity:'plan-activity', calendar:'plan-calendar' };
      goTo(map[ds.tab], {}, {replace:true});
      break;
    }
    case 'archive-tab': UI.archiveTab = ds.tab; renderAll(); break;
    case 'week-prev': UI.weekCursor = Engine.addDays(UI.weekCursor,-7); renderAll(); break;
    case 'week-next': UI.weekCursor = Engine.addDays(UI.weekCursor,7); renderAll(); break;
    case 'cal-prev': UI.calendarCursor = Engine.addMonths(UI.calendarCursor,-1); renderAll(); break;
    case 'cal-next': UI.calendarCursor = Engine.addMonths(UI.calendarCursor,1); renderAll(); break;

    /* ---- sales forecast ---- */
    case 'forecast-add': {
      const cycle = forecastCurrentCycle();
      const plan = ds.plan;
      if (!FORECAST_PLAN_COMMISSION_GROSS[plan]) return;

      DB.salesForecast.push({
        id: uid('sf'),
        cycle_id: cycle.id,
        date: Engine.today(),
        plan,
        quantity: 1,
        created_at: new Date().toISOString()
      });

      persist('salesForecast');
      renderAll();
      showToast(`Forecast sale added · ${plan}`);

    }

    /* ---- actual sales tracker ---- */
    case 'open-actual-sales':
      UI.overlay='actual-sales';
      UI.actualSalesDraft='1';
      UI.overlayJustOpened=true;
      renderAll();
      break;

    case 'actual-sales-plus':

      renderAll();
      break;

    case 'actual-sales-minus':

      renderAll();
      break;

    case 'save-actual-sales': {
      const qty=Math.max(1,Math.min(20,parseInt(UI.actualSalesDraft||'1',10)||1));
      addActualSaleCount(qty);
      UI.overlay=null;
      UI.actualSalesDraft='1';
      renderAll();
      showToast(`${qty} ${qty===1?'sale':'sales'} added · ${DB.actualSales}/120`);
      break;
    }

    /* ---- activity editor ---- */
    case 'toggle-activity-editor': {
      const app = document.getElementById('app');
      const scrollTop = app?.scrollTop || 0;
      const date = Engine.today();
      const existing = DB.activity.find(a => a.date === date);

      UI.activityExpanded = !UI.activityExpanded;

      if(UI.activityExpanded){
        UI.activityDraft = {
          prospects:Number(existing?.prospects || 0),
          calls:Number(existing?.calls || 0),
          appointments:Number(existing?.appointments || 0),
          presentations:Number(existing?.presentations || 0)
        };
      } else {
        UI.activityDraft = {prospects:0,calls:0,appointments:0,presentations:0};
      }

      renderAll({resetScroll:false,scrollActiveTab:false});
      requestAnimationFrame(() => {
        const root = document.getElementById('app');
        if (root) root.scrollTop = scrollTop;
      });
      break;
    }

    case 'activity-plus': {

      UI.activityDraft[k] = Math.min(999, Number(UI.activityDraft[k]||0) + 1);
      renderAll({resetScroll:false,scrollActiveTab:false});
      break;
    }

    case 'activity-minus': {
      const k = ds.metric;
      if (!UI.activityDraft) UI.activityDraft = {prospects:0,calls:0,appointments:0,presentations:0};
      UI.activityDraft[k] = Math.max(0, Number(UI.activityDraft[k]||0) - 1);
      renderAll({resetScroll:false,scrollActiveTab:false});

          appointments:Number(draft.appointments||0),
          presentations:Number(draft.presentations||0),

    case 'open-transaction':

        DB.expenses.push({

          description: desc,
          created_at: new Date().toISOString()

 UI.overlay='commission'; UI.keypadValue=''; UI.overlayJustOpened=true; renderAll(); break;
    case 'open-expense': UI.overlay='expense'; UI.keypadValue=''; UI.expenseCategory = DB.settings.last_expense_category || 'FOOD'; UI.expenseDetailsOpen=false; UI.expenseDescDraft=''; UI.overlayJustOpened=true; renderAll(); break;

    /* ---- commission save ---- */
    case 'save-commission': {
      const amt = Engine.toCents(UI.keypadValue);
      if (amt<=0) return;

      const today=Engine.today();
      const priorCycle=forecastPreviousCycle();

      // A Wednesday commission entry is the financial checkpoint for the
      // completed Thursday→Wednesday forecast cycle. Snapshot the forecast
      // before adding the actual deposit so history cannot move later.
      if(today===priorCycle.payout && !reconciliationForCycle(priorCycle.id)){
        const forecast=forecastTotals(priorCycle.id);
        reconcileCompletedCycle(priorCycle,forecast,amt,new Date().toISOString());
      }

      DB.commissions.push({
        id: uid('cm'),
        date: today,
        amount_cents: amt,
        note:'',
        created_at: new Date().toISOString()
      });
      await persist('commissions');
      // A commission is a high-priority financial event. Push it immediately
      // instead of relying only on the debounce timer, so a just-entered
      // Wednesday commission cannot be replaced by an older cloud snapshot.
      await cloudPush();

      UI.overlay = null;
      UI.keypadValue='';

      if (amt<=0 || !UI.expenseCategory) return;
      const desc = readStr('expenseDesc') || UI.expenseDescDraft;
      DB.expenses.push({ id: uid('ex'), date: Engine.today(), amount_cents: amt, category: UI.expenseCategory, description: desc||'', created_at: new Date().toISOString() });
      DB.settings.last_expense_category = UI.expenseCategory;
      await persist('expenses'); await persist('settings');
      if (action==='save-expense-again'){
        UI.keypadValue = '';
        UI.expenseDetailsOpen = false;
        UI.expenseDescDraft = '';
        renderAll();
        showToast('Expense saved · '+money(amt));
      } else {
        UI.overlay = null; UI.keypadValue=''; UI.expenseDescDraft='';
        renderAll();
        showToast('Expense saved · '+money(amt));
      }
      break;
    }

    /* ---- contribution save ---- */
    case 'save-contribution': {
      let amt = Engine.toCents(UI.keypadValue);
      if (amt<=0 || !UI.contributionGoalId) return;
      const goal = DB.goals.find(g=>g.id===UI.contributionGoalId);
      if (!goal) return;

      const availableNow=Math.max(Number(derive().available||0),0);
      const maxSafe=Math.max(availableNow-USABLE_CASH_FLOOR_CENTS,0);
      if(amt>maxSafe){
        amt=maxSafe;
        if(amt<=0){
          showToast('Cash floor protected · no funding available');
          return;
        }
      }

      DB.contributions.push({ id: uid('ct'), goal_id: goal.id, date: Engine.today(), amount_cents: amt, note:'', created_at: new Date().toISOString() });
      goal.current_amount_cents += amt;
      goal.updated_at = new Date().toISOString();
      persist('contributions'); persist('goals');
      UI.overlay = null; UI.keypadValue='';
      renderAll();
      showToast('Contribution added · '+money(amt));
      break;
    }

    case 'fund-next-goal': {
      const next=nextGoalForFunding();
      if(!next){
        showToast('No goal funding needed');
        break;
      }
      UI.contributionGoalId=next.goal.id;
      UI.keypadValue=String((next.amount/100).toFixed(2));
      UI.overlay='contribution';
      UI.overlayJustOpened=true;
      renderAll();
      break;
    }

    case 'create-recurring-goal':
      createRecurringGoal(decodeURIComponent(ds.key || ''));
      break;

    case 'goal-priority': {
      const goal=DB.goals.find(g=>g.id===ds.id);
      if(goal && !goal.recurring){
        goal.priority=['ESSENTIAL','IMPORTANT','OPTIONAL'].includes(ds.priority) ? ds.priority : 'IMPORTANT';
        goal.updated_at=new Date().toISOString();
        persist('goals');
        renderAll();
        showToast('Goal priority updated');
      }
      break;
    }

    /* ---- goal wizard ---- */
    case 'wizard-recurring-toggle': {
      syncWizardInputs();
      const g=ensureDraft();
      g.recurring=!g.recurring;
      renderAll();
      break;
    }
    case 'wizard-category': syncWizardInputs(); ensureDraft().category = ds.cat; renderAll(); break;
    case 'wizard-strategy': syncWizardInputs(); ensureDraft().savings_strategy = ds.k; renderAll(); break;
    case 'wizard-next-1': {
      const g = ensureDraft();
      g.name = readStr('goalName').trim() || 'Untitled Goal';
      g.description = readStr('goalDesc').trim();
      UI.goalWizard.step = 2; renderAll();
      break;
    }
    case 'wizard-next-2': {
      const g = ensureDraft();
      g.target_amount_cents = Engine.toCents(readNum('goalTarget') ?? 0);
      g.current_amount_cents = Engine.toCents(readNum('goalCurrent') ?? 0);
      g.target_date = readStr('goalDate') || Engine.addMonths(Engine.today(),12);

      const remaining = Math.max(g.target_amount_cents - g.current_amount_cents, 0);
      const months = Math.max(Engine.monthsBetween(Engine.today(), g.target_date), 1);
      g.monthly_contribution_cents = Math.ceil(remaining / months);

      UI.goalWizard.step = 3;
      renderAll();
      break;
    }
    case 'wizard-next-3': {
      const g = ensureDraft();
      const remaining=Math.max(g.target_amount_cents-g.current_amount_cents,0);
      const months=Math.max(Engine.monthsBetween(Engine.today(),g.target_date||Engine.addMonths(Engine.today(),12)),1);
      const monthly=Math.ceil(remaining/months);
      g.monthly_contribution_cents = g.savings_strategy==='WEEKLY'
        ? Math.ceil((monthly*12)/52)
        : monthly;
      UI.goalWizard.step = 4; renderAll();
      break;
    }
    case 'wizard-create': {
      const g = ensureDraft();
      const now = new Date().toISOString();
      const isRecurring=!!g.recurring;
      const recurringAmount=Number(g.monthly_contribution_cents || g.target_amount_cents || 0);
      const recurringKey=String(g.name||'')
        .toLowerCase().replace(/\d+/g,'')
        .replace(/[^a-záéíóúüñ ]/g,' ')
        .replace(/\s+/g,' ').trim();
      const goal = { id: uid('gl'), name:g.name, category:g.category, description:g.description,
        target_amount_cents:isRecurring ? recurringAmount : g.target_amount_cents,
        current_amount_cents:g.current_amount_cents,
        target_date:isRecurring ? Engine.endOfMonth(Engine.today()) : g.target_date,
        savings_strategy: g.savings_strategy,
        monthly_contribution_cents:isRecurring ? recurringAmount : g.monthly_contribution_cents,
        recurring:isRecurring,
        recurring_key:isRecurring ? recurringKey : null,
        recurring_amount_cents:isRecurring ? recurringAmount : null,
        recurring_cycle:isRecurring ? monthKey(Engine.today()) : null,
        created_at: now, updated_at: now };
      DB.goals.push(goal);
      persist('goals');
      UI.goalWizard = { step:1, draft:null };
      goTo('goal', { id: goal.id }, {replace:true});
      showToast('Goal created · '+esc(goal.name));
      break;
    }

    /* ---- settings ---- */
    case 'save-settings': {
      const s = DB.settings;
      s.user_name = readStr('setName').trim() || s.user_name;
      const target = readNum('setTarget'); s.monthly_target_cents = target!==null ? Engine.toCents(target) : null;
      const budget = readNum('setBudget'); s.monthly_budget_cents = budget!==null ? Engine.toCents(budget) : null;
      const opening = readNum('setOpening'); s.opening_capital_cents = opening!==null ? Engine.toCents(opening) : 0;
      const committed = readNum('setCommitted'); s.committed_cents = committed!==null ? Engine.toCents(committed) : 0;
      const ticket = readNum('setTicket'); s.average_ticket_cents = ticket!==null ? Engine.toCents(ticket) : null;
      const commSale = readNum('setCommPerSale'); s.expected_commission_per_sale_cents = commSale!==null ? Engine.toCents(commSale) : null;
      const pps = readNum('setPresPerSale'); if (pps!==null) s.funnel.presentationsPerSale = pps;
      const apr = readNum('setApptPerPres'); if (apr!==null) s.funnel.appointmentsPerPresentation = apr;
      const cpa = readNum('setCallsPerAppt'); if (cpa!==null) s.funnel.callsPerAppointment = cpa;
      const ppc = readNum('setProspPerCall'); if (ppc!==null) s.funnel.prospectsPerCall = ppc;
      persist('settings');
      goBack('command');
      showToast('Settings saved');
      break;
    }
    case 'edit-goal': showToast('Editing coming soon — adjust via Settings.'); break;
    default: break;
  }
}

document.addEventListener('DOMContentLoaded', init);

function attachGoalLiveCalculation(){
  const ids=['goalTarget','goalCurrent','goalDate'];
  ids.forEach(id=>{
    const el=document.getElementById(id);
    if(!el || el.dataset.goalLiveBound) return;
    el.addEventListener('input', refreshGoalRequiredMonthly);
    el.addEventListener('change', refreshGoalRequiredMonthly);
    el.dataset.goalLiveBound='1';
  });
  refreshGoalRequiredMonthly();
}

function attachListeners(){
  const viewport = document.getElementById('viewport');
  viewport.addEventListener('click', (e)=>{
    const t = e.target.closest('[data-action]');
    if (!t) return;
    e.preventDefault();
    handleAction(t.dataset.action, t.dataset, e);
  });
  // Archive/Goals/Plan gear icon shortcut to settings
  viewport.addEventListener('click', (e)=>{
    const gear = e.target.closest('.icon-btn');
    if (gear && gear.innerHTML.includes('circle cx="12" cy="12" r="3"') && !gear.dataset.action){
      goTo('settings');
    }
  });
}

async function init(){
  initCloudAuthUI();
  await loadAll();
  attachListeners();
  const cloudReady = false;
  renderAll();
  if(!cloudReady && !cloudUser) cloudShowGate('signin');
  setInterval(()=>{ const sb = document.getElementById('statusBar'); if (sb) sb.innerHTML = StatusBar(); }, 30000);
}

document.getElementById('statusBar').innerHTML = StatusBar();
</script>
