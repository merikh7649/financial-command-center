<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1"/>
<title>Financial Command Center — Real Banking</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,500&family=Playfair+Display:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>
/* ===========================================================
   FINANCIAL COMMAND CENTER — DESIGN SYSTEM
   Editorial luxury. iPhone-first 393x852.
   =========================================================== */
:root{
  --ink:#080807; --deep:#0D0C0A; --surface:#12110F; --surface-elevated:#171512; --border:#2A2823;
  --gold:#D6A13A; --gold-light:#E7B75A; --gold-muted:#8D692D;
  --ivory:#F2EEE6; --secondary:#B5B0A7; --muted:#77736C; --disabled:#4D4A45;
  --success:#78B94A; --warning:#C79A32; --danger:#B94A3F;
  --radius:14px; --radius-sm:10px; --radius-lg:16px;
  --pad:16px; --gap-sm:8px; --gap:16px; --gap-lg:24px; --gap-xl:32px;
  --btn-h:56px; --input-h:52px; --border-w:1px; --progress-h:7px;
}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
html,body{margin:0; padding:0; background:var(--ink); color:var(--ivory);}
svg{ width:18px; height:18px; flex-shrink:0; vertical-align:-3px; }
body{
  font-family:'Cormorant Garamond','Playfair Display',Georgia,serif;
  font-optical-sizing:auto;
  -webkit-font-smoothing:antialiased;
  font-feature-settings:"tnum" 1, "lnum" 1;
}
.sans{font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;}
button, input{font-family:inherit;}
a{color:inherit; text-decoration:none;}
svg{display:block;}
::-webkit-scrollbar{width:0; height:0;}

#viewport{
  width:393px; max-width:100vw; height:852px; max-height:100dvh;
  margin:0 auto; position:relative; background:var(--ink); overflow:hidden;
  box-shadow:0 0 80px rgba(0,0,0,.6);
}
@media (min-width:500px){
  body{ background:#000; display:flex; align-items:center; justify-content:center; min-height:100vh;}
  #viewport{ border-radius:44px; border:1px solid #232220; height:852px; }
}
#app{ position:absolute; inset:0; overflow-y:auto; overflow-x:hidden; padding-bottom:96px; -webkit-overflow-scrolling:touch;}


.status-bar{ position:sticky; top:0; z-index:40; display:flex; align-items:center; justify-content:space-between;
  padding:16px 22px 6px; font-family:'Inter',sans-serif; font-size:15px; font-weight:600; color:var(--ivory);
  background:linear-gradient(to bottom, rgba(8,8,7,.92), rgba(8,8,7,0));
  pointer-events:none;
}

/* ---------- layout helpers ---------- */
.screen{ padding:0 var(--pad) var(--gap-xl); animation:fadein .28s ease; }
@keyframes fadein{ from{opacity:0; transform:translateY(6px);} to{opacity:1; transform:none;} }
.section-gap{ margin-top:var(--gap-lg); }
.major-gap{ margin-top:var(--gap-xl); }

/* ---------- editorial header ---------- */
.hero{ position:relative; margin:0 calc(var(--pad) * -1) 0; padding:56px var(--pad) 28px; overflow:hidden; }
.hero-bg{ position:absolute; inset:0; background-size:cover; background-position:center; filter:saturate(.85) brightness(.75); }
.hero-scrim{ position:absolute; inset:0; background:linear-gradient(180deg, rgba(8,8,7,.55) 0%, rgba(8,8,7,.35) 40%, rgba(8,8,7,.96) 100%); }
.hero-content{ position:relative; z-index:1; }
.eyebrow{ font-family:'Inter',sans-serif; font-size:11px; letter-spacing:2.2px; color:var(--gold); font-weight:600; }
.masthead{ font-family:'Inter',sans-serif; font-size:15px; letter-spacing:6px; font-weight:600; color:var(--ivory); margin:2px 0 2px;}

.avatar{ width:58px; height:58px; border-radius:50%; border:1.5px solid var(--gold); object-fit:cover; margin-top:4px; }
.greeting{ font-family:'Inter',sans-serif; font-size:11px; letter-spacing:2px; color:var(--gold); margin-top:22px; }

.page-title{ display:flex; align-items:center; justify-content:space-between; padding-top:20px; }
.page-title h1{ font-size:26px; font-weight:500; letter-spacing:5px; margin:0; text-transform:uppercase; }
.page-title .sub{ display:block; font-family:'Inter',sans-serif; font-size:10.5px; letter-spacing:2px; color:var(--gold); margin-top:4px; text-transform:uppercase;}
.back-btn{ width:36px; height:36px; display:flex; align-items:center; justify-content:center; color:var(--gold); cursor:pointer; }

/* ---------- cards ---------- */
.card{ background:var(--surface); border:var(--border-w) solid var(--border); border-radius:var(--radius); padding:18px; }

.card-row{ display:flex; gap:var(--gap); }
.card-row > .card{ flex:1; min-width:0; }
.card-tight{ padding:14px; }
.divider{ height:1px; background:var(--border); border:none; margin:14px 0; }
.vdivider{ width:1px; background:var(--border); }

/* ---------- labels/type ---------- */
.label{ font-family:'Inter',sans-serif; font-size:10.5px; letter-spacing:1.6px; color:var(--muted); text-transform:uppercase; font-weight:600; display:flex; align-items:center; gap:5px; }
.label svg{ width:12px; height:12px; flex-shrink:0; vertical-align:middle; }
.label-gold{ color:var(--gold); }
.value-hero{ font-size:40px; font-weight:600; letter-spacing:.3px; line-height:1.05; margin:4px 0 0;}
.value-lg{ font-size:28px; font-weight:600; margin:2px 0 0; }
.value-md{ font-size:20px; font-weight:600; }
.caption{ color:var(--secondary); font-size:14px; margin-top:4px;}
.tiny{ font-family:'Inter',sans-serif; font-size:11px; color:var(--muted); }
.gold{ color:var(--gold); } .ivory-c{color:var(--ivory);} .green{color:var(--success);} .red{color:var(--danger);} .muted-c{color:var(--muted);}


/* ---------- buttons ---------- */
.btn{ height:var(--btn-h); border-radius:12px; display:flex; align-items:center; justify-content:center; gap:8px;
  font-family:'Inter',sans-serif; font-size:13.5px; letter-spacing:1.4px; font-weight:600; text-transform:uppercase; cursor:pointer; border:none; width:100%;}
.btn-primary{ background:linear-gradient(180deg, var(--gold-light), var(--gold)); color:var(--ink); }
.btn-primary:active{ filter:brightness(.94); }
.btn-secondary{ background:transparent; border:1px solid var(--border); color:var(--ivory); }
.btn-secondary:active{ background:rgba(255,255,255,.03); }

.btn-text{ background:none; border:none; color:var(--gold); font-family:'Inter',sans-serif; font-size:13px; letter-spacing:1.2px; text-transform:uppercase; font-weight:600; cursor:pointer; }
.btn-row{ display:flex; gap:12px; }
.btn-row > *{ flex:1; }
.icon-btn{ width:40px; height:40px; border-radius:50%; border:1px solid var(--gold-muted); display:flex; align-items:center; justify-content:center; color:var(--gold); cursor:pointer; background:transparent;}
.icon-btn:active{ background:rgba(214,161,58,.08); }
.fab{ width:52px; height:52px; border-radius:50%; background:linear-gradient(180deg,var(--gold-light),var(--gold)); color:var(--ink); display:flex; align-items:center; justify-content:center; cursor:pointer; box-shadow:0 8px 24px rgba(214,161,58,.25); border:none;}

/* ---------- bottom nav ---------- */
.bottom-nav{ position:absolute; left:0; right:0; bottom:0; z-index:50; background:rgba(13,12,10,.94); backdrop-filter:blur(14px);
  border-top:1px solid var(--border); display:flex; padding:10px 4px calc(env(safe-area-inset-bottom,0px) + 8px); }
.nav-item{ flex:1; display:flex; flex-direction:column; align-items:center; gap:4px; cursor:pointer; padding:4px 0; min-height:44px; justify-content:center;}
.nav-item svg{ width:21px; height:21px; }
.nav-item .nav-label{ font-family:'Inter',sans-serif; font-size:9.5px; letter-spacing:1.1px; font-weight:600; text-transform:uppercase; }
.nav-item.active svg, .nav-item.active .nav-label{ color:var(--gold); }
.nav-item:not(.active) svg, .nav-item:not(.active) .nav-label{ color:var(--muted); }

/* ---------- progress ---------- */
.progress-bar-track{ height:var(--progress-h); background:var(--border); border-radius:8px; overflow:hidden; position:relative;}
.progress-bar-fill{ height:100%; border-radius:8px; background:linear-gradient(90deg,var(--gold-muted),var(--gold-light)); transition:width .5s cubic-bezier(.4,0,.2,1); }
.progress-bar-fill.green{ background:linear-gradient(90deg,#4d7a30,var(--success)); }
.progress-bar-fill.red{ background:linear-gradient(90deg,#7a352c,var(--danger)); }

/* ---------- status badge ---------- */
.badge{ display:inline-flex; align-items:center; gap:6px; padding:5px 12px; border-radius:20px; font-family:'Inter',sans-serif; font-size:10.5px; letter-spacing:1.2px; font-weight:700; text-transform:uppercase; border:1px solid; }
.badge-gold{ color:var(--gold); border-color:var(--gold-muted); background:rgba(214,161,58,.08); }
.badge-green{ color:var(--success); border-color:#3c5c2a; background:rgba(120,185,74,.08); }
.badge-red{ color:var(--danger); border-color:#5c2c26; background:rgba(185,74,63,.08); }
.badge-gray{ color:var(--muted); border-color:var(--border); background:rgba(255,255,255,.02); }

/* ---------- tabs ---------- */
.tabbar{ display:flex; gap:12px; overflow-x:auto; padding-bottom:10px; border-bottom:1px solid var(--border); margin-top:18px; scroll-padding:0 24px; }
.tab{ font-family:'Inter',sans-serif; font-size:10px; letter-spacing:1.1px; text-transform:uppercase; font-weight:600; color:var(--muted); white-space:nowrap; cursor:pointer; padding-bottom:10px; margin-bottom:-11px; border-bottom:2px solid transparent; flex-shrink:0; }
.tab.active{ color:var(--gold); border-bottom-color:var(--gold); }

/* ---------- inputs ---------- */
.field{ background:var(--surface); border:1px solid var(--border); border-radius:var(--radius-sm); padding:12px 14px; display:flex; align-items:center; gap:10px; min-height:var(--input-h); }
.field input, .field textarea{ background:none; border:none; outline:none; color:var(--ivory); font-family:'Inter',sans-serif; font-size:15px; width:100%; }
.field textarea{ font-family:'Cormorant Garamond',serif; font-size:16px; resize:none; }
.field input::placeholder, .field textarea::placeholder{ color:var(--disabled); }

/* ---------- category grid ---------- */
.cat-grid{ display:grid; grid-template-columns:1fr 1fr 1fr; gap:10px; }
.cat-cell{ background:var(--surface); border:1px solid var(--border); border-radius:12px; padding:14px 8px; display:flex; flex-direction:column; align-items:center; gap:8px; cursor:pointer; }
.cat-cell svg{ width:24px; height:24px; color:var(--secondary); }
.cat-cell .cat-name{ font-family:'Inter',sans-serif; font-size:10.5px; letter-spacing:1px; font-weight:700; color:var(--secondary); }
.cat-cell.selected{ border-color:var(--gold); background:rgba(214,161,58,.06); }
.cat-cell.selected svg, .cat-cell.selected .cat-name{ color:var(--gold); }

/* ---------- keypad ---------- */
.keypad{ display:grid; grid-template-columns:repeat(3,1fr); gap:10px; }
.key{ background:var(--surface); border:1px solid var(--border); border-radius:12px; height:60px; display:flex; align-items:center; justify-content:center; font-size:24px; color:var(--ivory); cursor:pointer; user-select:none; }
.key:active{ background:var(--surface-elevated); }
.key.backspace{ color:var(--secondary); }
.amount-display{ text-align:center; padding:26px 10px; }
.amount-display .amt{ font-size:48px; font-weight:600; letter-spacing:.5px; }
.amount-display .cur{ font-size:16px; color:var(--muted); vertical-align:top; }

/* ---------- overlay sheet ---------- */
.overlay{ position:absolute; inset:0; z-index:100; background:var(--ink); display:flex; flex-direction:column; }
.overlay.entering{ animation:fadein .22s ease; }
.overlay-body{ flex:1; overflow-y:auto; padding:0 var(--pad) 20px; }
.overlay-header{ padding:18px var(--pad) 0; flex-shrink:0; }

/* ---------- toast ---------- */
.toast{ position:absolute; left:16px; right:16px; bottom:20px; z-index:200; background:var(--surface-elevated); border:1px solid var(--gold-muted);
  border-radius:12px; padding:14px 16px; display:flex; align-items:center; justify-content:space-between; gap:12px; animation:toastin .3s cubic-bezier(.2,.8,.2,1); font-family:'Inter',sans-serif; font-size:13px;}
@keyframes toastin{ from{opacity:0; transform:translateY(14px);} to{opacity:1; transform:none;} }

/* ---------- empty state ---------- */
.empty{ text-align:center; padding:44px 20px; color:var(--secondary); }
.empty svg{ width:34px; height:34px; color:var(--gold-muted); margin-bottom:14px;}
.empty .headline{ font-size:18px; color:var(--ivory); margin-bottom:6px; }

/* ---------- misc ---------- */
.row{ display:flex; align-items:center; justify-content:space-between; }
.stack{ display:flex; flex-direction:column; gap:var(--gap-sm); }
.hairline{ height:1px; background:var(--border); }


.list-item{ display:flex; align-items:center; gap:12px; padding:14px 0; border-bottom:1px solid var(--border); }
.list-item:last-child{ border-bottom:none; }
.list-icon{ width:38px; height:38px; border-radius:50%; background:var(--surface-elevated); border:1px solid var(--border); display:flex; align-items:center; justify-content:center; color:var(--gold); flex-shrink:0;}
.dot{ width:6px; height:6px; border-radius:50%; display:inline-block; }

@keyframes spin{ to{transform:rotate(360deg);} }

.commission-card,.goals-card{min-height:120px;}

.goal-name{font-family:Inter,sans-serif;font-size:11.5px;line-height:1.08;margin:6px auto 2px;color:var(--ivory);max-width:78px;}

.bottom-grid{margin-top:10px;}

@media(max-width:380px){


.goal-name{font-size:10.5px}
}


/* ==========================================================
   COMMAND CENTER — VISUAL REFERENCE OVERRIDES
   Scoped to the Command screen so the rest of the app keeps
   its existing engine-driven screens and interactions.
   ========================================================== */
#statusBar{display:none!important;}

#viewport{
  width:393px;
  max-width:100vw;
  height:852px;
  max-height:100dvh;
  background:#050505;
}

@media(min-width:500px){
  #viewport{height:852px; border-radius:44px;}
}

#app{
  background:#050505;
  padding-bottom:100px;
}

.command-period{
  height:22px;
  padding:0 7px;
  display:flex;
  align-items:center;
  gap:6px;
  border:1px solid #34332f;
  border-radius:5px;
  font-size:7px;
  color:#f5f1e9;
}

.command-period span{font-size:10px;transform:translateY(-1px);}

/* Bottom navigation: match the approved Command Center reference */
#navRoot .bottom-nav{
  position:absolute;
  left:14px;
  right:14px;
  bottom:30px;
  z-index:50;
  height:78px;
  display:grid;
  grid-template-columns:repeat(6,1fr);
  background:linear-gradient(180deg,rgba(24,24,23,.98),rgba(15,15,14,.98));
  border:1px solid #282724;
  border-radius:18px;
  box-shadow:0 10px 32px rgba(0,0,0,.5),inset 0 1px rgba(255,255,255,.025);
  backdrop-filter:blur(18px);
}

#navRoot .nav-item{
  position:relative;
  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;
  gap:3px;
  color:#898680;
}

#navRoot .nav-item.active{color:#efbb59;}
#navRoot .nav-item.active::before{
  content:"";
  position:absolute;
  left:50%;
  top:-1px;
  width:30px;
  height:1px;
  transform:translateX(-50%);
  background:#efbb59;
}

#navRoot .nav-item svg{width:18px;height:18px;}
#navRoot .nav-label{font-size:7px;letter-spacing:.1px;text-transform:uppercase;}

@media(max-width:380px){


}

.entry-type-toggle{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:6px;
  margin-top:6px;
}
.entry-type-btn{
  appearance:none;
  border:1px solid var(--border);
  background:rgba(255,255,255,.02);
  color:var(--muted);
  border-radius:7px;
  padding:10px 8px;
  font-family:Inter,system-ui,sans-serif;
  font-size:8px;
  letter-spacing:1.6px;
  font-weight:700;
}
.entry-type-btn.active{
  border-color:var(--gold);
  color:var(--ivory);
  background:rgba(197,146,56,.10);
}
.entry-category-grid{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:7px;
}

.actual-sales-stepper{display:flex;align-items:center;justify-content:center;gap:18px;margin-top:13px;}
.actual-sales-step-btn{
  width:42px;height:42px;border-radius:50%;border:1px solid var(--border);
  background:rgba(255,255,255,.03);color:var(--ivory);font-size:24px;
}
.actual-sales-step-value{min-width:52px;text-align:center;font-family:'Cormorant Garamond',serif;font-size:38px;color:var(--ivory);}

/* PLAN HERO */
.plan-hero{
  position:relative;
  height:300px;
  margin:0 calc(var(--pad) * -1) 0;
  overflow:hidden;
  border-bottom:1px solid rgba(197,146,56,.20);
}
.plan-hero-bg{
  position:absolute;
  inset:0;
  background:url('plan_hero.jpg') center center / cover no-repeat;
  filter:saturate(.78) brightness(.78);
  transform:scale(1.015);
}
.plan-hero-scrim{
  position:absolute;
  inset:0;
  background:
    linear-gradient(90deg,rgba(5,5,4,.72) 0%,rgba(5,5,4,.30) 58%,rgba(5,5,4,.16) 100%),
    linear-gradient(180deg,rgba(5,5,4,.08) 25%,rgba(5,5,4,.84) 100%);
}
 .plan-hero-content{
  position:relative;

}
.plan-hero-top{
  display:flex;

  justify-content:space-between;
  gap:14px;
}
.plan-hero-top h1{
  margin:0;
  font:400 44px/1 'Cormorant Garamond',Georgia,serif;
  letter-spacing:4px;

}
.plan-hero-avatar{
  width:58px;
  height:58px;
  flex:0 0 58px;
  border-radius:50%;
  object-fit:cover;
  object-position:center;

  box-shadow:0 0 0 1px rgba(0,0,0,.45),0 5px 16px rgba(0,0,0,.28);
}
.plan-hero-line,.plan-hero-index,.plan-hero-content p{display:none!important;}


/* PLAN EDITORIAL */
.plan-editorial-screen{padding-bottom:26px}.plan-editorial-eyebrow,.plan-section-index{font:700 8px Inter,sans-serif;letter-spacing:2.4px;color:var(--gold)}.plan-editorial-intro h1,.plan-command-section h2,.plan-requirement-head h3{margin:14px 0 0;font:400 38px/.94 'Cormorant Garamond',Georgia,serif;letter-spacing:-.6px;color:var(--ivory)}.plan-editorial-intro h1 em,.plan-command-section h2 em,.plan-requirement-head h3 em{font-style:italic;color:rgba(244,240,232,.68)}.plan-editorial-intro p,.plan-command-section p,.plan-requirement-head p{max-width:290px;margin:14px 0 0;font:11px/1.55 Inter,sans-serif;color:var(--muted)}.plan-annual-editorial,.plan-month-editorial,.plan-metrics-editorial,.plan-requirement-editorial{padding:20px 19px 17px;background:linear-gradient(135deg,rgba(197,146,56,.055),rgba(255,255,255,.012));border-color:rgba(197,146,56,.24)}.plan-annual-head{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;margin-top:16px}.plan-big-number{font:400 58px/.78 'Cormorant Garamond',Georgia,serif;color:var(--ivory)}.plan-big-context{margin-top:8px;font:9px Inter,sans-serif;color:var(--muted)}.plan-annual-percent{font:400 38px/.8 'Cormorant Garamond',Georgia,serif;color:var(--gold)}.plan-annual-percent span{font-size:20px}.plan-editorial-progress{height:4px;margin-top:20px;background:rgba(255,255,255,.09);overflow:hidden}.plan-editorial-progress span{display:block;height:100%;background:var(--gold)}.plan-editorial-progress.thin{margin-top:17px;height:3px}.plan-annual-foot,.plan-month-meta,.plan-target-progress-meta{display:flex;justify-content:space-between;gap:10px;margin-top:10px;font:7px Inter,sans-serif;letter-spacing:1.1px;color:var(--muted)}.plan-text-action{padding:0;border:0;background:none;color:var(--gold);font:700 7px Inter,sans-serif;letter-spacing:1px}.plan-month-grid{display:flex;align-items:flex-end;justify-content:space-between;margin-top:15px}.plan-month-number{font:400 42px/.8 'Cormorant Garamond',Georgia,serif;color:var(--ivory)}.plan-month-side{text-align:right}.plan-side-value{font:400 28px/.8 'Cormorant Garamond',Georgia,serif;color:var(--gold)}.plan-side-label{margin-top:5px;font:7px Inter,sans-serif;letter-spacing:1.5px;color:var(--muted)}.plan-command-section{padding:4px 8px 0 2px}.plan-command-section h2{font-size:34px}.plan-target-number{margin-top:14px;font:400 42px/.9 'Cormorant Garamond',Georgia,serif;color:var(--ivory)}.plan-target-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:18px;padding-top:13px;border-top:1px solid var(--border)}.plan-target-grid div{display:flex;flex-direction:column;gap:5px}.plan-target-grid span,.plan-funnel-grid span{font:7px Inter,sans-serif;letter-spacing:1.2px;color:var(--muted)}.plan-target-grid strong{font:400 18px 'Cormorant Garamond',Georgia,serif;color:var(--ivory)}.plan-target-progress{margin-top:18px}.plan-requirement-head{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;margin-top:12px}.plan-requirement-head h3{font-size:31px;margin-top:0}.plan-requirement-sales{text-align:right}.plan-requirement-sales strong{display:block;font:400 35px/.8 'Cormorant Garamond',Georgia,serif;color:var(--gold)}.plan-requirement-sales span{display:block;margin-top:6px;font:7px Inter,sans-serif;letter-spacing:1.4px;color:var(--muted)}.plan-funnel-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:0;margin-top:20px;border-top:1px solid var(--border)}.plan-funnel-grid div{padding:12px 8px 8px 0;border-bottom:1px solid var(--border)}.plan-funnel-grid div:nth-child(even){padding-left:12px;border-left:1px solid var(--border)}.plan-funnel-grid strong{display:block;margin-top:4px;font:400 23px 'Cormorant Garamond',Georgia,serif;color:var(--ivory)}.plan-weekly-cta{margin-top:22px}
.activity-input-card{transition:border-color .2s ease;}
.activity-expand-mark{
  width:28px;height:28px;border:1px solid var(--border);border-radius:50%;
  display:flex;align-items:center;justify-content:center;
  color:var(--gold);font-family:Inter,system-ui,sans-serif;font-size:17px;
}
.activity-editor{
  margin-top:14px;padding-top:12px;border-top:1px solid var(--border);
}
.activity-editor-date{
  color:var(--gold);letter-spacing:1px;
}
.activity-editor-row{
  display:grid;
  grid-template-columns:28px 1fr 34px 44px 34px;
  gap:8px;
  align-items:center;
  margin-top:10px;
}
.activity-editor-icon{color:var(--muted);display:flex;align-items:center;justify-content:center;}
.activity-editor-label{
  font-family:Inter,system-ui,sans-serif;
  font-size:9px;letter-spacing:1px;color:var(--muted);
}
.activity-step-btn{
  width:34px;height:34px;border-radius:50%;
  border:1px solid var(--border);background:rgba(255,255,255,.02);
  color:var(--ivory);font-size:18px;
}
.activity-step-value{
  text-align:center;font-family:'Cormorant Garamond',serif;
  font-size:24px;color:var(--ivory);
}
.activity-save-btn{width:100%;margin-top:15px;}

.command-period-wrap{position:relative;}
.command-period{
  cursor:pointer;
  border:1px solid #34332f;
  background:rgba(20,20,19,.88);
  color:#f5f1e9;
}
.trajectory-period-menu{
  position:absolute;
  right:0;
  top:27px;
  min-width:116px;
  z-index:30;
  padding:4px;
  background:#171715;
  border:1px solid #34332f;
  border-radius:7px;
  box-shadow:0 10px 24px rgba(0,0,0,.45);
}
.trajectory-period-option{
  display:block;
  width:100%;
  padding:7px 8px;
  border:0;
  border-radius:5px;
  background:transparent;
  color:#9d9992;
  text-align:left;
  font-family:Inter,system-ui,sans-serif;
  font-size:7px;
  letter-spacing:.3px;
  cursor:pointer;
}
.trajectory-period-option.active{
  color:#efbb59;
  background:rgba(197,146,56,.10);
}

.goal-sales-integration-card{
  border:1px solid rgba(197,146,56,.24);
  background:rgba(197,146,56,.025);
}
.recurring-goals-card{border-color:rgba(197,146,56,.22);}

.recurring-goal-toggle{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:12px;
  padding:13px 14px;
  border:1px solid var(--border);
  border-radius:12px;
  background:rgba(255,255,255,.015);
  cursor:pointer;
}
.recurring-goal-toggle:active{transform:scale(.995);}
.recurring-switch{
  width:42px;
  height:24px;
  border-radius:999px;
  border:1px solid var(--border);
  background:#24231f;
  padding:2px;
  flex:0 0 auto;
}
.recurring-switch span{
  display:block;
  width:18px;
  height:18px;
  border-radius:50%;
  background:#77726a;
  transition:transform .18s ease,background .18s ease;
}
.recurring-switch.on{
  border-color:var(--gold);
  background:rgba(197,146,56,.16);
}
.recurring-switch.on span{
  transform:translateX(18px);
  background:var(--gold);
}


.goal-monthly-allocation-card{
  border-color:rgba(197,146,56,.26);
  background:rgba(197,146,56,.025);
}

.priority-allocation-card{
  border-color:rgba(197,146,56,.26);
  background:rgba(197,146,56,.025);
}
.priority-choice-grid{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:8px;
}
.priority-choice{
  border:1px solid var(--border);
  border-radius:9px;
  background:rgba(255,255,255,.015);
  color:var(--muted);
  padding:9px 6px;
  font-family:Inter,system-ui,sans-serif;
  font-size:6.5px;
  letter-spacing:.8px;
  cursor:pointer;
}
.priority-choice.selected{
  border-color:var(--gold);
  color:var(--gold);
  background:rgba(197,146,56,.08);
}

.goal-funding-card{
  border-color:rgba(197,146,56,.30);
  background:rgba(197,146,56,.035);
}

.weekly-goal-funding-card{
  border-color:rgba(197,146,56,.30);
  background:rgba(197,146,56,.03);
}

.performance-card{border-color:rgba(197,146,56,.24);background:rgba(197,146,56,.025);}
.performance-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;text-align:center;}

.adaptive-forecast-card{
  border-color:rgba(197,146,56,.30);
  background:rgba(197,146,56,.03);
}

.adaptive-commission-card{
  border-color:rgba(197,146,56,.30);
  background:rgba(197,146,56,.03);
}

.weekly-review-card,.weekly-adjustment-card{
  border-color:rgba(197,146,56,.24);
  background:rgba(197,146,56,.025);
}

.goal-execution-card{
  border-color:rgba(197,146,56,.30);
  background:rgba(197,146,56,.035);
}

.goal-date-aware-card{border-color:rgba(197,146,56,.24);background:rgba(197,146,56,.025);}

.money-screen-visual{
  --money-bg:#0b0b0a;
}
.money-hero{
  position:relative;
  height:300px;
  margin:0 calc(var(--pad) * -1);
  overflow:hidden;
}
.money-hero-bg{
  position:absolute;
  inset:0;
  background-image:url('money_hero.jpg');
  background-size:cover;
  background-position:center 46%;
  filter:saturate(.72) brightness(.58);
  transform:scale(1.015);
}
.money-hero-scrim{
  position:absolute;
  inset:0;
  background:
    linear-gradient(180deg,rgba(6,6,5,.48) 0%,rgba(6,6,5,.12) 34%,rgba(6,6,5,.86) 100%),
    linear-gradient(90deg,rgba(6,6,5,.74) 0%,rgba(6,6,5,.18) 70%,rgba(6,6,5,.52) 100%);
}
.money-hero-content{
  position:relative;
  z-index:1;
  height:100%;
  min-height:300px;
  padding:26px var(--pad) 28px;
  display:flex;
  flex-direction:column;
  justify-content:space-between;
}
.money-hero-top{
  display:flex;
  align-items:flex-start;
  justify-content:space-between;
}
.money-hero-top h1{
  margin:2px 0 0;
  font-family:'Cormorant Garamond',Georgia,serif;
  font-size:44px;
  line-height:1;
  font-weight:400;
  letter-spacing:5px;
  color:var(--ivory);
}
.money-avatar{
  width:58px;
  height:58px;
  border-radius:50%;
  object-fit:cover;
  border:1px solid var(--gold);
  box-shadow:0 0 0 1px rgba(214,161,58,.08),0 8px 22px rgba(0,0,0,.28);
}
.money-capital{
  margin-bottom:4px;
}
.money-kicker,.money-card-kicker{
  font-family:'Inter',sans-serif;
  font-size:10.5px;
  letter-spacing:2.1px;
  color:var(--gold);
  text-transform:uppercase;
  font-weight:600;
}
.money-capital-value{
  margin-top:8px;
  font-family:'Cormorant Garamond',Georgia,serif;
  font-size:51px;
  line-height:.95;
  letter-spacing:.7px;
  color:var(--ivory);
  font-weight:400;
}

.money-content{
  padding:14px 0 30px;
}
.money-content .card{
  border-radius:12px;
  background:linear-gradient(180deg,rgba(18,18,17,.93),rgba(12,12,11,.97));
  border-color:rgba(255,255,255,.09);
}
.money-commission-card{
  display:grid;
  grid-template-columns:1.35fr 1px .85fr auto;
  gap:18px;
  align-items:center;
  padding:22px 18px;
  min-height:142px;
}
.money-commission-value,.money-use-value{
  margin-top:8px;
  font-family:'Cormorant Garamond',Georgia,serif;
  font-size:39px;
  line-height:1;
  color:var(--ivory);
  font-weight:400;
}
.money-commission-divider{
  align-self:stretch;
  background:rgba(255,255,255,.1);
}
.money-next-commission{
  display:flex;
  flex-direction:column;
  justify-content:center;
}
.money-next-number{
  font-family:'Cormorant Garamond',Georgia,serif;
  font-size:32px;
  line-height:1;
  color:var(--ivory);
}
.money-next-label{
  margin-top:5px;
  font-family:'Cormorant Garamond',Georgia,serif;
  font-size:13px;
  line-height:1.1;
  letter-spacing:1px;
  color:var(--secondary);
}
.money-plus{
  width:58px;
  height:58px;
  border-radius:50%;
  border:1px solid var(--gold);
  color:var(--gold);
  background:rgba(10,10,9,.2);
  font-size:34px;
  line-height:1;
  font-family:'Inter',sans-serif;
  font-weight:300;
  cursor:pointer;
}
.money-income-actions{display:flex;flex-direction:column;align-items:center;gap:8px;min-width:92px;}
.money-other-income-btn{background:transparent;border:1px solid var(--gold-muted);color:var(--gold);border-radius:999px;padding:7px 10px;font-family:'Inter',sans-serif;font-size:7.5px;letter-spacing:1.1px;font-weight:700;white-space:nowrap;cursor:pointer;}
.money-other-income-btn:active{background:rgba(214,161,58,.08);}

.money-chart-card{
  padding:20px 16px 16px;
}
.money-card-header{
  display:flex;
  align-items:center;
  justify-content:space-between;
}
.money-period{
  font-family:'Inter',sans-serif;
  color:var(--ivory);
  font-size:9px;
  letter-spacing:1.1px;
  display:flex;
  gap:5px;
  align-items:center;
}
.money-chart-wrap{ margin-top:14px; min-height:220px; }
.money-chart-legend{
  display:flex;
  gap:24px;
  margin-top:8px;
  color:var(--secondary);
  font-family:'Inter',sans-serif;
  font-size:8px;
  letter-spacing:1.1px;
}
.money-legend-line{
  display:inline-block;
  width:26px;
  height:1px;
  margin:0 6px 3px 0;
  vertical-align:middle;
}
.money-legend-line.actual{background:var(--gold);}
.money-legend-line.projected{
  border-top:1px dashed var(--gold-muted);
}
.money-spending-card{
  padding:20px 16px 18px;
}
.money-spending-main{
  display:grid;
  grid-template-columns:1.02fr 112px 1.55fr;
  gap:18px;
  align-items:center;
  margin-top:18px;
}
.money-spend-number{
  margin-top:5px;
  font-family:'Cormorant Garamond',Georgia,serif;
  font-size:39px;
  line-height:1;
  color:var(--ivory);
}
.money-spending-cats{
  display:flex;
  flex-direction:column;
  gap:12px;
}
.money-spend-cat-top{
  display:flex;
  justify-content:space-between;
  gap:10px;
  color:var(--ivory);
  font-family:'Cormorant Garamond',Georgia,serif;
  font-size:13px;
  line-height:1;
}
.money-cat-track{
  height:2px;
  margin-top:6px;
  background:rgba(255,255,255,.11);
}
.money-cat-track>div{
  height:100%;
  background:var(--gold);
}
.money-use-card{
  padding:24px 18px;
  display:flex;
  align-items:center;
  justify-content:space-between;
}
.money-use-icon{
  width:56px;
  height:56px;
  color:var(--gold);
}
.money-use-icon svg{width:56px;height:56px;}
@media (max-width:430px){
  .money-hero{min-height:290px;}
  .money-hero-content{min-height:290px;padding-top:25px;}
  .money-capital-value{font-size:48px;}
  .money-commission-card{
    grid-template-columns:1.25fr 1px .78fr auto;
    gap:13px;
    padding:19px 14px;
  }
  .money-commission-value{font-size:35px;}
  .money-next-number{font-size:29px;}
  .money-plus{width:53px;height:53px;font-size:31px;}
  .money-spending-main{
    grid-template-columns:1fr 96px;
  }
  .money-spending-cats{
    grid-column:1/-1;
    margin-top:4px;
  }
}

.forecast-visual-screen{
  background:#050505;
  color:#f5f1e9;
  padding-bottom:22px!important;
}
.forecast-hero{
  position:relative;
  height:300px;
  margin:0 calc(var(--pad) * -1);
  overflow:hidden;
}
.forecast-hero-bg{
  position:absolute;
  inset:0;
  background:url('forecast_hero.jpg') center 48% / cover no-repeat;
  filter:brightness(.68) saturate(.82);
}
.forecast-hero-scrim{
  position:absolute;
  inset:0;
  background:linear-gradient(180deg,rgba(0,0,0,.24) 0%,rgba(0,0,0,.08) 38%,rgba(0,0,0,.9) 100%);
}
.forecast-hero-content{
  position:relative;
  z-index:1;
  height:100%;
  padding:25px 23px 22px;
  display:flex;
  flex-direction:column;
  justify-content:space-between;
}
.forecast-header-row{
  display:flex;
  justify-content:space-between;
  align-items:flex-start;
}
.forecast-brand{
  font:600 9px/1 'Inter',sans-serif;
  letter-spacing:2.5px;
  color:var(--gold);
}
.forecast-date{
  margin-top:7px;
  font:500 10px/1 'Inter',sans-serif;
  letter-spacing:1.6px;
  color:var(--ivory);
}

.forecast-avatar{
  width:58px;height:58px;border-radius:50%;object-fit:cover;
  border:1px solid var(--gold);
}
.forecast-welcome-kicker{
  font:600 10px/1 'Inter',sans-serif;
  letter-spacing:2.8px;
  color:var(--gold);
}
.forecast-welcome-name{
  margin-top:5px;
  font:400 45px/.94 'Cormorant Garamond',Georgia,serif;
  color:var(--ivory);
}

.forecast-content{
  padding:0 10px 28px;
  margin-top:-1px;
}
.forecast-content .card{
  border-radius:13px;
  background:rgba(17,17,16,.96);
  border:1px solid rgba(255,255,255,.1);
}
.forecast-main-card{
  padding:18px 16px 15px;
}
.forecast-card-head{
  display:flex;
  align-items:center;
  justify-content:space-between;
}
.forecast-card-kicker{
  font:600 10px/1 'Inter',sans-serif;
  letter-spacing:2.2px;
  color:var(--gold);
}
.forecast-period,.forecast-details{
  font:500 9px/1 'Inter',sans-serif;
  letter-spacing:.8px;
  color:var(--ivory);
  display:flex;align-items:center;gap:4px;
}
.forecast-main-value{
  margin-top:17px;
  font:400 43px/.95 'Cormorant Garamond',Georgia,serif;
}
.forecast-main-delta{
  margin-top:7px;
  color:var(--gold);
  font:600 11px/1.2 'Inter',sans-serif;
}
.forecast-main-delta span{
  color:var(--secondary);
  font-weight:400;
}
.forecast-line-chart{
  margin-top:18px;
  height:175px;
}
.forecast-line-chart svg{width:100%;height:100%;}
.forecast-legend{
  display:flex;gap:22px;margin-top:5px;
  font:500 8px/1 'Inter',sans-serif;
  letter-spacing:1px;color:var(--secondary);
}
.forecast-legend i{
  display:inline-block;width:24px;height:1px;
  margin:0 6px 3px 0;vertical-align:middle;
}
.forecast-actual-line{background:var(--gold);}
.forecast-projected-line{border-top:1px dashed var(--gold-muted);}
.forecast-summary-card{padding:18px 10px 15px;}
.forecast-summary-grid{
  display:grid;grid-template-columns:repeat(4,1fr);margin-top:14px;
}
.forecast-summary-item{
  min-width:0;padding:0 8px;text-align:center;
  border-right:1px solid rgba(255,255,255,.1);
}
.forecast-summary-item:last-child{border-right:0;}
.forecast-icon{
  width:38px;height:38px;margin:0 auto 10px;border:1px solid var(--gold);
  border-radius:50%;display:flex;align-items:center;justify-content:center;color:var(--gold);
}
.forecast-icon svg{width:21px;height:21px;}
.forecast-summary-label{
  min-height:25px;font:500 7px/1.2 'Inter',sans-serif;
  color:var(--secondary);letter-spacing:.5px;
}
.forecast-summary-value{
  margin-top:8px;font:400 17px/1 'Cormorant Garamond',Georgia,serif;
  color:var(--ivory);
}
.forecast-summary-note{
  margin-top:5px;font:500 6.5px/1.2 'Inter',sans-serif;color:var(--gold);
}
.forecast-monthly-card{padding:18px 14px 15px;}
.forecast-monthly-chart{height:210px;margin-top:12px;}
.forecast-monthly-chart svg{width:100%;height:100%;}
.forecast-scenarios-card{padding:18px 14px 15px;}
.forecast-scenario-grid{
  display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin-top:14px;
}
.forecast-scenario{
  border:1px solid rgba(255,255,255,.1);border-radius:10px;
  padding:18px 8px;text-align:center;min-height:130px;
}
.forecast-scenario.realistic{border-color:var(--gold);}
.forecast-scenario-label{
  font:600 9px/1 'Inter',sans-serif;letter-spacing:1px;color:var(--gold);
}
.forecast-scenario.optimistic .forecast-scenario-label{color:#76bd93;}
.forecast-scenario.pessimistic .forecast-scenario-label{color:#b85a4f;}
.forecast-scenario-value{
  margin-top:15px;font:400 25px/1 'Cormorant Garamond',Georgia,serif;color:var(--ivory);
}
.forecast-scenario-note{
  margin-top:9px;font:500 7px/1.2 'Inter',sans-serif;color:var(--secondary);
}
@media(max-width:430px){
  .forecast-hero{height:300px;}
  .forecast-summary-grid{grid-template-columns:repeat(2,1fr);row-gap:16px;}

<script>
/* ===========================================================
   FINANCIAL COMMAND CENTER — CALCULATION ENGINE
   Pure functions. No DOM. No storage. Testable in isolation.
   Money is always integer cents. Currency: MXN.
   =========================================================== */

const Engine = (() => {

  // ---------- money ----------
  function toCents(pesosStr) {
    if (pesosStr === '' || pesosStr === null || pesosStr === undefined) return 0;
    const n = parseFloat(pesosStr);
    if (isNaN(n)) return 0;
    return Math.round(n * 100);
  }
  function fmtMoney(cents, opts = {}) {
    const { showCents = false, sign = false } = opts;
    const neg = cents < 0;
    const abs = Math.abs(cents);
    const whole = Math.floor(abs / 100);
    const centsPart = abs % 100;
    let str = '$' + whole.toLocaleString('en-US');
    if (showCents) str += '.' + String(centsPart).padStart(2, '0');
    if (neg) str = '-' + str;
    else if (sign && cents > 0) str = '+' + str;
    return str;
  }
  function fmtPct(n, digits = 0) {
    if (n === null || n === undefined || !isFinite(n)) return '—';
    return n.toFixed(digits) + '%';
  }

  // ---------- dates ----------
  const DAY = 86400000;
  function d(dateStr) { return new Date(dateStr + 'T00:00:00'); }
  function iso(date) {
    const y = date.getFullYear(), m = String(date.getMonth() + 1).padStart(2, '0'), dd = String(date.getDate()).padStart(2, '0');
    return `${y}-${m}-${dd}`;
  }
  function today() { return iso(new Date()); }
  function addDays(dateStr, n) { const dt = d(dateStr); dt.setDate(dt.getDate() + n); return iso(dt); }
  function addMonths(dateStr, n) {
    const dt = d(dateStr);
    const wholeMonths = Math.floor(n);
    const frac = n - wholeMonths;
    dt.setMonth(dt.getMonth() + wholeMonths);
    if (frac > 0) dt.setDate(dt.getDate() + Math.round(frac * 30));
    return iso(dt);
  }
  function startOfWeek(dateStr) { // Monday start
    const dt = d(dateStr);
    const day = dt.getDay(); // 0 Sun..6 Sat
    const diff = (day === 0 ? -6 : 1 - day);
    dt.setDate(dt.getDate() + diff);
    return iso(dt);
  }
  function endOfWeek(dateStr) { return addDays(startOfWeek(dateStr), 6); }
  function startOfMonth(dateStr) { const dt = d(dateStr); return iso(new Date(dt.getFullYear(), dt.getMonth(), 1)); }
  function endOfMonth(dateStr) { const dt = d(dateStr); return iso(new Date(dt.getFullYear(), dt.getMonth() + 1, 0)); }
  function startOfYear(dateStr) { const dt = d(dateStr); return iso(new Date(dt.getFullYear(), 0, 1)); }
  function endOfYear(dateStr) { const dt = d(dateStr); return iso(new Date(dt.getFullYear(), 11, 31)); }
  function inRange(dateStr, startStr, endStr) { return dateStr >= startStr && dateStr <= endStr; }
  function daysBetween(aStr, bStr) { return Math.round((d(bStr) - d(aStr)) / DAY); }
  function monthsBetween(aStr, bStr) {
    // number of calendar month boundaries between a and b, min 1 if b>a
    const a = d(aStr), b = d(bStr);
    let months = (b.getFullYear() - a.getFullYear()) * 12 + (b.getMonth() - a.getMonth());
    if (b.getDate() < a.getDate()) months -= 1;
    return Math.max(months, b > a ? 1 : 0);
  }
  function weekdayLabel(dateStr) {
    return ['SUN','MON','TUE','WED','THU','FRI','SAT'][d(dateStr).getDay()];
  }
  function monthLabel(dateStr, opts) {
    const dt = d(dateStr);
    return dt.toLocaleDateString('en-US', opts || { month: 'short', year: 'numeric' }).toUpperCase();
  }
  function isWorkingDay(dateStr, workingDays) {
    // workingDays: array of 0-6 (0=Sun) that ARE working days
    const day = d(dateStr).getDay();
    return workingDays.includes(day);
  }
  function calendarWeeksForMonth(anyDateInMonth) {
    // Real Mon-Sun weeks covering a month — 4, 5, or 6 depending on how the month
    // falls against week boundaries. Single source of truth for "how many weeks are
    // in this month" so different screens never disagree with each other.
    const monthStart = startOfMonth(anyDateInMonth);
    const monthEnd = endOfMonth(anyDateInMonth);
    const weeks = [];
    let cursor = startOfWeek(monthStart);
    while (cursor <= monthEnd) { weeks.push(cursor); cursor = addDays(cursor, 7); }
    return weeks;
  }

  // ---------- aggregation ----------
  function sumAmount(records, startStr, endStr) {
    return records
      .filter(r => inRange(r.date, startStr, endStr))
      .reduce((s, r) => s + r.amount_cents, 0);
  }
  function sumBy(records, keyFn) {
    const map = {};
    records.forEach(r => { const k = keyFn(r); map[k] = (map[k] || 0) + r.amount_cents; });
    return map;
  }

  // ---------- commission ----------
  function commissionSummary(commissions, refDateStr = today()) {
    const wS = startOfWeek(refDateStr), wE = endOfWeek(refDateStr);
    const mS = startOfMonth(refDateStr), mE = endOfMonth(refDateStr);
    const yS = startOfYear(refDateStr), yE = endOfYear(refDateStr);
    const sorted = [...commissions].sort((a, b) => b.date.localeCompare(a.date) || b.created_at.localeCompare(a.created_at));
    return {
      weekly: sumAmount(commissions, wS, wE),
      monthly: sumAmount(commissions, mS, mE),
      yearly: sumAmount(commissions, yS, yE),
      last: sorted[0] || null,
      count: commissions.length
    };
  }

  // ---------- expense ----------
  function expenseSummary(expenses, refDateStr = today()) {
    const wS = startOfWeek(refDateStr), wE = endOfWeek(refDateStr);
    const mS = startOfMonth(refDateStr), mE = endOfMonth(refDateStr);
    const monthly = expenses.filter(e => inRange(e.date, mS, mE));
    const byCategory = sumBy(monthly, e => e.category);
    const monthlyTotal = monthly.reduce((s, e) => s + e.amount_cents, 0);
    const categories = Object.entries(byCategory)
      .map(([category, amount_cents]) => ({
        category, amount_cents,
        pct: monthlyTotal > 0 ? (amount_cents / monthlyTotal) * 100 : 0
      }))
      .sort((a, b) => b.amount_cents - a.amount_cents);
    return {
      weekly: sumAmount(expenses, wS, wE),
      monthly: monthlyTotal,
      categories,
      recent: [...expenses].sort((a, b) => b.date.localeCompare(a.date) || b.created_at.localeCompare(a.created_at)).slice(0, 10)
    };
  }

  // ---------- budget ----------
  function budgetStatus(spentCents, budgetCents, thresholds = { watch: 0.75, over: 1.0 }) {
    if (!budgetCents || budgetCents <= 0) return 'NO BUDGET SET';
    const used = spentCents / budgetCents;
    if (used > thresholds.over) return 'OVER BUDGET';
    if (used >= thresholds.watch) return 'WATCH';
    return 'ON TRACK';
  }
  function availableMoney({ incomeTotalCents, openingCapitalCents, spendingCents, committedCents }) {
    return (incomeTotalCents || 0) + (openingCapitalCents || 0) - (spendingCents || 0) - (committedCents || 0);
  }

  // ---------- goals ----------
  function goalProgress(goal) {
    const target = goal.target_amount_cents;
    const current = goal.current_amount_cents;
    const pct = target > 0 ? Math.min(Math.max((current / target) * 100, 0), 100) : 0;
    const remaining = Math.max(target - current, 0);
    return { pct, remaining };
  }
  function goalTimeRequirement(goal, refDateStr = today()) {
    const { remaining } = goalProgress(goal);
    if (remaining === 0) return { monthsRemaining: 0, requiredMonthlyCents: 0 };
    const monthsRemaining = Math.max(monthsBetween(refDateStr, goal.target_date), 1);
    const requiredMonthlyCents = Math.round(remaining / monthsRemaining);
    return { monthsRemaining, requiredMonthlyCents };
  }
  function goalProjection(goal, refDateStr = today()) {
    const { remaining } = goalProgress(goal);
    const monthly = goal.monthly_contribution_cents || 0;
    if (remaining === 0) return { projectedDate: refDateStr, available: true };
    if (monthly <= 0) return { projectedDate: null, available: false };
    const monthsToComplete = remaining / monthly;
    return { projectedDate: addMonths(refDateStr, monthsToComplete), available: true, monthsToComplete };
  }
  function goalStatus(goal, refDateStr = today(), aheadThresholdDays = 14) {
    const { remaining } = goalProgress(goal);
    if (remaining === 0) return 'COMPLETE';
    const proj = goalProjection(goal, refDateStr);
    if (!proj.available) {
      return goal.target_date < refDateStr ? 'BEHIND' : 'ON TRACK';
    }
    const diffDays = daysBetween(proj.projectedDate, goal.target_date); // positive = projected before target
    if (diffDays >= aheadThresholdDays) return 'AHEAD';
    if (diffDays >= 0) return 'ON TRACK';
    return 'BEHIND';
  }
  function goalFull(goal, refDateStr = today(), aheadThresholdDays = 14) {
    const progress = goalProgress(goal);
    const time = goalTimeRequirement(goal, refDateStr);
    const proj = goalProjection(goal, refDateStr);
    const status = goalStatus(goal, refDateStr, aheadThresholdDays);
    return { ...goal, ...progress, ...time, projection: proj, status };
  }
  function overallGoalsProgress(goals) {
    const targetSum = goals.reduce((s, g) => s + g.target_amount_cents, 0);
    const currentSum = goals.reduce((s, g) => s + g.current_amount_cents, 0);
    return targetSum > 0 ? Math.min((currentSum / targetSum) * 100, 100) : 0;
  }

  // ---------- sales engine ----------
  function ceilDiv(numerator, denominator) {
    if (!denominator || denominator <= 0) return null;
    return Math.ceil(numerator / denominator);
  }
  function salesRequirement({ monthlyTargetCents, currentCents, expectedCommissionPerSaleCents }) {
    const gap = Math.max((monthlyTargetCents || 0) - (currentCents || 0), 0);
    const requiredSales = expectedCommissionPerSaleCents > 0 ? ceilDiv(gap, expectedCommissionPerSaleCents) : null;
    return { gap, requiredSales };
  }
  function activityRequirement(requiredSales, funnel) {
    // funnel: { presentationsPerSale, appointmentsPerPresentation, callsPerAppointment, prospectsPerCall }
    if (requiredSales === null || requiredSales === undefined) return null;
    const presentations = requiredSales * funnel.presentationsPerSale;
    const appointments = presentations * funnel.appointmentsPerPresentation;
    const calls = appointments * funnel.callsPerAppointment;
    const prospects = calls * funnel.prospectsPerCall;
    return { presentations, appointments, calls, prospects };
  }

  // ---------- weekly plan ----------
  function weeklyPlan({ weeklyTargetCents, currentWeeklyCents, refDateStr = today(), workingDays = [1,2,3,4,5,6] }) {
    const gap = Math.max((weeklyTargetCents || 0) - (currentWeeklyCents || 0), 0);
    const weekEnd = endOfWeek(refDateStr);
    let daysRemaining = 0;
    let cursor = refDateStr;
    while (cursor <= weekEnd) {
      if (isWorkingDay(cursor, workingDays)) daysRemaining++;
      cursor = addDays(cursor, 1);
    }
    const dailyPaceCents = daysRemaining > 0 ? Math.round(gap / daysRemaining) : gap;
    return { gap, daysRemaining, dailyPaceCents };
  }

  // ---------- spending pace ----------
  function spendingPace({ monthlySpendingCents, refDateStr = today() }) {
    const mS = startOfMonth(refDateStr);
    const elapsedDays = Math.max(daysBetween(mS, refDateStr) + 1, 1);
    const dt = new Date(d(refDateStr).getFullYear(), d(refDateStr).getMonth() + 1, 0);
    const daysInMonth = dt.getDate();
    const pace = monthlySpendingCents / elapsedDays;
    return { pace, projected: Math.round(pace * daysInMonth), elapsedDays, daysInMonth, confident: elapsedDays >= 5 };
  }

  return {
    toCents, fmtMoney, fmtPct, d,
    today, iso, addDays, addMonths, startOfWeek, endOfWeek, startOfMonth, endOfMonth,
    startOfYear, endOfYear, inRange, daysBetween, monthsBetween, weekdayLabel, monthLabel, isWorkingDay, calendarWeeksForMonth,
    sumAmount, sumBy,
    commissionSummary, expenseSummary,
    budgetStatus, availableMoney,
    goalProgress, goalTimeRequirement, goalProjection, goalStatus, goalFull, overallGoalsProgress,
    ceilDiv, salesRequirement, activityRequirement,
    weeklyPlan, spendingPace
  };
})();

if (typeof module !== 'undefined') module.exports = Engine;

</script>

'use strict';

const SUPABASE_URL = 'https://zvutyjxckqrrucsbpsqn.supabase.co';
const SUPABASE_PUBLISHABLE_KEY = 'sb_publishable_KMHvuXgCA-cBYz5TPK5cgw_utoIVZ4Q';
const supabaseClient = window.supabase?.createClient
  ? window.supabase.createClient(SUPABASE_URL, SUPABASE_PUBLISHABLE_KEY)
  : null;
const CLOUD_SYNC_VERSION = 1;
const CLOUD_POLL_MS = 5000;
let cloudUser = null;
let cloudSyncReady = false;
let cloudSyncTimer = null;
let cloudPullInFlight = false;
let cloudPushInFlight = false;
let cloudPushQueued = false;
let cloudLastUpdatedAt = null;
let cloudLocalRevision = 0;
let cloudSyncedRevision = 0;

function cloudStateSnapshot(){
  return {
    version: CLOUD_SYNC_VERSION,
    commissions: (DB.commissions||[]).filter(x=>x && !x.bank_import),
    otherIncome: (DB.otherIncome||[]).filter(x=>x && !x.bank_import),
    expenses: (DB.expenses||[]).filter(x=>x && !x.bank_import),
    goals: DB.goals || [],
    contributions: DB.contributions || [],
    activity: DB.activity || [],
    settings: DB.settings || defaultSettings(),
    salesForecast: DB.salesForecast || [],
    actualSales: Number(DB.actualSales ?? 59),
    monthlySales: DB.monthlySales || {},
    actualSalesEvents: DB.actualSalesEvents || [],
    reconciliations: DB.reconciliations || []
  };
}

function applyCloudState(state){
  if (!state || typeof state !== 'object') return;
  const importedCommissions = (REAL_BANK_IMPORT.commissions||[]).map(x=>({...x}));
  const importedExpenses = (REAL_BANK_IMPORT.expenses||[]).map(x=>({...x}));
  DB.commissions = importedCommissions.concat(Array.isArray(state.commissions) ? state.commissions : []);
  DB.otherIncome = Array.isArray(state.otherIncome) ? state.otherIncome : [];
  DB.expenses = importedExpenses.concat(Array.isArray(state.expenses) ? state.expenses : []);
  DB.reimbursements = (REAL_BANK_IMPORT.reimbursements||[]).map(x=>({...x}));
  DB.goals = Array.isArray(state.goals) ? state.goals : [];
  DB.contributions = Array.isArray(state.contributions) ? state.contributions : [];
  DB.activity = Array.isArray(state.activity) ? state.activity : [];
  DB.settings = Object.assign(defaultSettings(), state.settings || {});
  DB.settings.user_name = 'Braulio';
  DB.settings.bank_balance_override_cents = REAL_BANK_IMPORT.current_balance_cents;
  DB.settings.bank_data_as_of = REAL_BANK_IMPORT.as_of;
  DB.bankOtherIncome = REAL_BANK_IMPORT.other_income;
  DB.bankIncomeReview = REAL_BANK_IMPORT.income_review;
  DB.bankMonthlyBalances = REAL_BANK_IMPORT.monthly_balances;
  DB.salesForecast = Array.isArray(state.salesForecast) ? state.salesForecast : [];
  DB.actualSales = Math.max(0, parseInt(state.actualSales ?? 59,10) || 0);
  DB.monthlySales = state.monthlySales && typeof state.monthlySales === 'object' ? state.monthlySales : {};
  DB.actualSalesEvents = Array.isArray(state.actualSalesEvents) ? state.actualSalesEvents : [];
  DB.reconciliations = Array.isArray(state.reconciliations) ? state.reconciliations : [];
}

function cloudSetStatus(text, kind=''){
  const el=document.getElementById('fcc-auth-status');
  if(el){ el.textContent=text||''; el.className='fcc-auth-status'+(kind?' '+kind:''); }
}
function cloudShowBadge(text='Cloud synced'){
  const el=document.getElementById('fcc-sync-badge');
  if(!el) return;
  el.textContent=text;
  el.style.display='block';
  clearTimeout(cloudShowBadge._t);
  cloudShowBadge._t=setTimeout(()=>{el.style.display='none';},1600);
}
function cloudShowGate(mode='signin'){
  const gate=document.getElementById('fcc-auth-gate');
  if(!gate) return;
  gate.style.display='flex';
  document.getElementById('fcc-auth-title').textContent=mode==='signup'?'Create account':'Sign in';
  document.getElementById('fcc-auth-copy').textContent=mode==='signup'
    ? 'Create one account to keep your financial command center synchronized across your devices.'
    : 'Sign in to keep your financial command center synchronized across your devices.';
  document.getElementById('fcc-auth-submit').textContent=mode==='signup'?'Create account':'Sign in';
  document.getElementById('fcc-auth-toggle').textContent=mode==='signup'?'I already have an account':'Create account';
  const pw=document.getElementById('fcc-auth-password');
  if(pw) pw.autocomplete=mode==='signup'?'new-password':'current-password';
  gate.dataset.mode=mode;
}
function cloudHideGate(){
  const gate=document.getElementById('fcc-auth-gate');
  if(gate) gate.style.display='none';
}

async function cloudLoadRow(){
  if(!supabaseClient || !cloudUser) return null;
  const {data,error}=await supabaseClient
    .from('financial_state')
    .select('state,updated_at')
    .eq('user_id',cloudUser.id)
    .maybeSingle();
  if(error) throw error;
  return data || null;
}

async function cloudPush(){
  if(!supabaseClient || !cloudUser || !cloudSyncReady) return;
  if(cloudPushInFlight){
    cloudPushQueued=true;
    return;
  }
  cloudPushInFlight=true;
  try{
    const now=new Date().toISOString();
    const {data,error}=await supabaseClient
      .from('financial_state')
      .upsert({user_id:cloudUser.id,state:cloudStateSnapshot(),updated_at:now},{onConflict:'user_id'})
      .select('updated_at')
      .single();
    if(error) throw error;
    cloudLastUpdatedAt=data?.updated_at || now;
    cloudSyncedRevision=cloudLocalRevision;
    cloudShowBadge('Cloud synced');
  }catch(error){
    console.error('Financial Command Center cloud sync failed:',error);
    cloudShowBadge('Sync unavailable');
  }finally{
    cloudPushInFlight=false;
    if(cloudPushQueued){
      cloudPushQueued=false;
      // Flush the newest in-memory state immediately after the in-flight
      // request completes, preventing a newer commission from being lost.
      queueMicrotask(()=>cloudPush());
    }
  }
}

function queueCloudPush(){
  if(!cloudSyncReady) return;
  clearTimeout(cloudSyncTimer);
  cloudSyncTimer=setTimeout(()=>cloudPush(),350);
}

async function cloudPullIfChanged(force=false){
  if(!supabaseClient || !cloudUser || !cloudSyncReady || cloudPullInFlight || cloudPushInFlight) return;
  cloudPullInFlight=true;
  try{
    const row=await cloudLoadRow();
    if(!row) return;
    if(!force && cloudLastUpdatedAt && row.updated_at===cloudLastUpdatedAt) return;
    // Never let a polling response replace unsent local edits with an older
    // cloud snapshot. Local mutations are always authoritative until pushed.
    if(!force && cloudLocalRevision!==cloudSyncedRevision) return;
    if(row.state && Object.keys(row.state).length){
      applyCloudState(row.state);
      await Promise.all([
        Storage.set(KEYS.commissions,JSON.stringify(DB.commissions.filter(x=>!x.bank_import))),
        Storage.set(KEYS.otherIncome,JSON.stringify(DB.otherIncome.filter(x=>!x.bank_import))),
        Storage.set(KEYS.expenses,JSON.stringify(DB.expenses.filter(x=>!x.bank_import))),
        Storage.set(KEYS.goals,JSON.stringify(DB.goals)),
        Storage.set(KEYS.contributions,JSON.stringify(DB.contributions)),
        Storage.set(KEYS.activity,JSON.stringify(DB.activity)),
        Storage.set(KEYS.settings,JSON.stringify(DB.settings)),
        Storage.set(KEYS.salesForecast,JSON.stringify(DB.salesForecast)),
        Storage.set(KEYS.actualSales,JSON.stringify(DB.actualSales)),
        Storage.set(KEYS.monthlySales,JSON.stringify(DB.monthlySales)),
        Storage.set(KEYS.actualSalesEvents,JSON.stringify(DB.actualSalesEvents)),
        Storage.set(KEYS.reconciliations,JSON.stringify(DB.reconciliations))
      ]);
      cloudLastUpdatedAt=row.updated_at;
      cloudSyncedRevision=cloudLocalRevision;
      renderAll({resetScroll:false,scrollActiveTab:false});
      cloudShowBadge('Updated from cloud');
    }
  }catch(error){
    console.error('Financial Command Center cloud pull failed:',error);
  }finally{ cloudPullInFlight=false; }
}

async function initCloudSync(){
  if(!supabaseClient){
    cloudShowGate('signin');
    cloudSetStatus('Cloud connection could not be initialized.','error');
    return false;
  }
  const {data:{session}}=await supabaseClient.auth.getSession();
  if(session?.user){
    cloudUser=session.user;
  }else{
    cloudShowGate('signin');
    return false;
  }
  try{
    const row=await cloudLoadRow();
    cloudSyncReady=true;
    if(row?.state && Object.keys(row.state).length){
      applyCloudState(row.state);
      cloudLastUpdatedAt=row.updated_at;
    }else{
      await cloudPush();
    }
    cloudSyncReady=true;
    cloudHideGate();
    setInterval(()=>cloudPullIfChanged(false),CLOUD_POLL_MS);
    return true;
  }catch(error){
    console.error('Financial Command Center cloud initialization failed:',error);
    cloudShowGate('signin');
    cloudSetStatus('Could not connect to your cloud data. Please try again.','error');
    return false;
  }
}

async function handleCloudAuthSubmit(evt){
  evt.preventDefault();
  const mode=document.getElementById('fcc-auth-gate')?.dataset.mode || 'signin';
  const email=document.getElementById('fcc-auth-email')?.value.trim();
  const password=document.getElementById('fcc-auth-password')?.value || '';
  if(!email || password.length<6){ cloudSetStatus('Enter a valid email and a password with at least 6 characters.','error'); return; }
  cloudSetStatus(mode==='signup'?'Creating account…':'Signing in…');
  try{
    if(mode==='signup'){
      const {data,error}=await supabaseClient.auth.signUp({email,password});
      if(error) throw error;
      if(data.session){
        cloudUser=data.user;
        cloudSetStatus('Account created.','success');
      }else{
        cloudSetStatus('Account created. Check your email to confirm it, then sign in.','success');
      }
    }else{
      const {data,error}=await supabaseClient.auth.signInWithPassword({email,password});
      if(error) throw error;
      cloudUser=data.user;
      const ok=false;
      cloudSetStatus('Signed in.','success');
    }
  }catch(error){
    console.error('Financial Command Center auth error:',error);
    cloudSetStatus(error?.message || 'Unable to authenticate.','error');
  }
}

  }

/* ---------------- storage (persists via artifact key-value store; falls back to memory) ---------------- */
const MemoryStore = {};
const Storage = {
  async get(key){
    // Web/PWA persistence must prefer browser storage. Some hosted environments
    // expose a window.storage shim that is not persistent across page reloads.
    try{
      const v = window.localStorage ? window.localStorage.getItem(key) : null;
      if (v !== null) return v;
    }catch(e){ /* localStorage unavailable */ }
    try{
      if (window.storage && window.storage.get){
        const r = await window.storage.get(key, false);
        if (r && r.value != null) return r.value;
      }
    }catch(e){ /* key not found or unavailable */ }
    return Object.prototype.hasOwnProperty.call(MemoryStore, key) ? MemoryStore[key] : null;
  },
  async set(key, value){
    // Write synchronously to localStorage first so a web/PWA save is durable
    // even if an optional host storage API is unavailable or slow.
    MemoryStore[key] = value;
    try{
      if (window.localStorage) window.localStorage.setItem(key, value);
    }catch(e){ /* silently keep in-memory copy */ }
    try{
      if (window.storage && window.storage.set){
        await window.storage.set(key, value, false);
      }
    }catch(e){ /* browser localStorage is already the durable fallback */ }
  }
};

/* ============================================================
   SALES FORECAST
   Forecast only — never modifies actual banking data.
   Plan reference values from the commission table:
   A 4100 · A-MSI 4000 · B 3800 · C 3400 · D 2400 · E 1700 · F 1300
   Forecast uses 84% net because SAT is already deducted before the bank deposit.
   ============================================================ */

const FORECAST_PLAN_COMMISSION_GROSS = {
  A: 410000,
  'A-MSI': 400000,
  B: 380000,
  C: 340000,
  D: 240000,
  E: 170000,
  F: 130000
};

function forecastCycleForDate(dateStr){
  const d = Engine.d(dateStr);
  const day = d.getDay(); // 0 Sun ... 3 Wed
  const daysSinceThursday = (day + 7 - 4) % 7;
  const start = Engine.addDays(dateStr, -daysSinceThursday);
  const end = Engine.addDays(start, 6);
  const payout = Engine.addDays(start, 13); // next Wednesday after cycle end
  return {
    id: `${start}`,
    start,
    end,
    payout
  };
}

function forecastCurrentCycle(){
  return forecastCycleForDate(Engine.today());
}

function forecastEntriesForCycle(cycleId){
  return (DB.salesForecast || []).filter(x => x.cycle_id === cycleId);
}

function forecastTotals(cycleId){
  const entries = forecastEntriesForCycle(cycleId);
  const counts = {A:0,'A-MSI':0,B:0,C:0,D:0,E:0,F:0};

  entries.forEach(e=>{
    const plan=e.plan;
    if(Object.prototype.hasOwnProperty.call(counts,plan)) counts[plan]+=Number(e.quantity||0);
  });

  const manualGross = Object.entries(counts).reduce(
    (s,[plan,n]) => s + (FORECAST_PLAN_COMMISSION_GROSS[plan] || 0)*n,
    0
  );

  // Actual sales have no plan selected. Estimate their commission using the
  // user's Jan-Jul actual plan mix, which is the forecast baseline.
  const cycleActualSales = (DB.actualSalesEvents || [])
    .filter(e=>e.cycle_id===cycleId)
    .reduce((s,e)=>s+Number(e.quantity||0),0);

  const actualNetRate = actualNetCommissionPerSaleCents();
  const actualNet = cycleActualSales * actualNetRate;

  // Manual plan entries remain based on the current plan chart.
  // Actual sales use learned real net commission per sale.
  const manualNet = Math.round(manualGross*0.84);
  const net = manualNet + actualNet;
  const gross = manualGross + Math.round(actualNet/0.84);

  return {
    counts,
    gross_cents:Math.round(gross),
    net_cents:net,
    manualGross_cents:Math.round(manualGross),
    actualSales:cycleActualSales,
    actualGross_cents:Math.round(actualNet/0.84),
    actualNet_cents:Math.round(actualNet),
    entries
  };
}


function forecastPerSaleFromPerformance(){
  const p=performanceAnalytics();

}

function forecastExpectedNextCheck(){
  const cycle = forecastCurrentCycle();
  const totals = forecastTotals(cycle.id);
  return { cycle, totals };
}


function actualNetCommissionPerSaleCents(){
  const totalCommissionCents =
    DB.commissions.reduce((s,c)=>s + Number(c.amount_cents || 0), 0);

  const totalReversalCents =
    (REAL_BANK_IMPORT.commission_reversals || [])
      .reduce((s,r)=>s + Number(r.amount_cents || 0), 0);

  const actualSales = Math.max(
    0,
    Math.floor(Number(DB.actualSales ?? 59))
  );

  if (actualSales <= 0) return 247305;

  return Math.max(
    1,
    Math.round((totalCommissionCents - totalReversalCents) / actualSales)
  );
}


const MONTHLY_SALES_TARGET = 20;

function calculateMonthlyFinancialTargetCents(){
  return MONTHLY_SALES_TARGET * actualNetCommissionPerSaleCents();
}

function derive(){
  /* Current-period metrics always use TODAY.
     The imported bank snapshot date is used only as the latest available
     bank-balance snapshot, so a new month starts at zero for monthly charts. */
  const currentDate = Engine.today();
  const bankAsOf = DB.settings.bank_data_as_of || currentDate;

  const cSum = Engine.commissionSummary(DB.commissions, currentDate);
  const eSum = Engine.expenseSummary(DB.expenses, currentDate);
  const settings = DB.settings;

  const commissionReversalTotal =
    (REAL_BANK_IMPORT.commission_reversals || [])
      .reduce((s,r)=>s + Number(r.amount_cents || 0), 0);

  const commissionReversalMonthly =
    (REAL_BANK_IMPORT.commission_reversals || [])
      .filter(r=>Engine.inRange(
        r.date,
        Engine.startOfMonth(currentDate),
        Engine.endOfMonth(currentDate)
      ))
      .reduce((s,r)=>s + Number(r.amount_cents || 0), 0);

  const netCommissionMonthly =
    Math.max(cSum.monthly - commissionReversalMonthly, 0);

  const netCommissionTotal =
    Math.max(cSum.total - commissionReversalTotal, 0);

  const calculatedAvailable = Engine.availableMoney({
    incomeTotalCents:
      DB.commissions.reduce((s,c)=>s+c.amount_cents,0),
    openingCapitalCents:
      settings.opening_capital_cents || 0,
    spendingCents:
      DB.expenses.reduce((s,e)=>s+e.amount_cents,0),
    committedCents:
      settings.committed_cents || 0
  });

  /* Bank closing balance is the starting point for live cash. Entries
     imported from the bank are already reflected in that closing balance.
     Only transactions entered in the app after the snapshot move the live
     balance from that point forward. */
  const liveCommissionAdjustment = (DB.commissions||[])
    .filter(c=>!c.bank_import)
    .reduce((s,c)=>s+Number(c.amount_cents||0),0);
  const liveExpenseAdjustment = (DB.expenses||[])
    .filter(e=>!e.bank_import)
    .reduce((s,e)=>s+Number(e.amount_cents||0),0);
  const liveOtherIncomeAdjustment = (DB.otherIncome||[])
    .filter(i=>!i.bank_import)
    .reduce((s,i)=>s+Number(i.amount_cents||0),0);
  const available =
    settings.bank_balance_override_cents != null
      ? settings.bank_balance_override_cents + liveCommissionAdjustment + liveOtherIncomeAdjustment - liveExpenseAdjustment
      : calculatedAvailable;

  /* Cash Available = Total Net Worth - Liabilities - Goals - Minimum Cash Floor.
     Goals use the amount already funded (current amount), since that money is
     no longer freely available. Committed/reserved funds are treated as the
     app's current liability/reserved obligation until a separate liability
     ledger exists. */
  const totalNetWorth = Math.max(Number(available || 0), 0);
  const liabilitiesCents = Math.max(Number(settings.committed_cents || 0), 0);
  const fundedGoalsCents = (DB.goals || [])
    .reduce((s,g)=>s + Math.max(Number(g.current_amount_cents || 0),0), 0);
  const cashFloorCents = USABLE_CASH_FLOOR_CENTS;
  const cashAvailable = Math.max(
    totalNetWorth - liabilitiesCents - fundedGoalsCents - cashFloorCents,
    0
  );

  /* Money to Use and Cash Available use the same spendable-cash figure. */
  const availableThisMonth = cashAvailable;

  const budgetStatus =
    Engine.budgetStatus(
      eSum.monthly,
      settings.monthly_budget_cents,
      settings.budget_thresholds
    );

  const goalsFull =
    DB.goals.map(g =>
      Engine.goalFull(
        g,
        currentDate,
        settings.ahead_threshold_days
      )
    );

  const overallGoalsPct =
    Engine.overallGoalsProgress(DB.goals);

  const expectedCommissionPerSaleCents =
    actualNetCommissionPerSaleCents();

  const monthlyFinancialTargetCents = calculateMonthlyFinancialTargetCents();

  const recurringGoalMonthlyCents = (DB.goals||[])
    .filter(g=>g.recurring===true)
    .reduce((s,g)=>s+Number(g.recurring_amount_cents||g.target_amount_cents||0),0);

  const nonRecurringGoalMonthlyCents = (DB.goals||[])
    .filter(g=>g.recurring!==true)
    .reduce((s,g)=>{
      const full=Engine.goalFull(g,currentDate,settings.ahead_threshold_days);
      return s+Number(full.requiredMonthlyCents||0);
    },0);

  const plannedGoalFundingMonthlyCents =
    recurringGoalMonthlyCents + nonRecurringGoalMonthlyCents;

  const sales =
    Engine.salesRequirement({
      monthlyTargetCents:
        monthlyFinancialTargetCents,
      currentCents:
        netCommissionMonthly,

}
function LineChart({ series, labels, width=361, height=190, targetY=null, todayIndex=null, callout=null }){
  // series: [{name,color,dash,points:[cents...]}]  points may contain null for future/unknown
  const padL=44, padR=10, padT=14, padB=22;
  const allVals = series.flatMap(s=>s.points.filter(v=>v!==null && v!==undefined));
  const maxV = Math.max(...allVals, targetY||0, 1);
  const minV = 0;
  const n = labels.length;
  const xw = width - padL - padR;
  const x = i => padL + (n<=1?0:(xw * i/(n-1)));
  const y = v => padT + (height-padT-padB) * (1 - (v-minV)/(maxV-minV||1));
  function pathFor(points){
    let d='', started=false;
    points.forEach((v,i)=>{
      if (v===null||v===undefined){ started=false; return; }
      const cmd = started ? 'L' : 'M';
      d += `${cmd}${x(i).toFixed(1)},${y(v).toFixed(1)} `;
      started = true;
    });
    return d.trim();
  }
  const gridLines = 3;
  let grid='';
  for(let i=0;i<=gridLines;i++){
    const gy = padT + (height-padT-padB)*i/gridLines;
    const val = maxV * (1 - i/gridLines);
    grid += `<line x1="${padL}" y1="${gy}" x2="${width-padR}" y2="${gy}" stroke="var(--border)" stroke-width="1"/>
      <text x="0" y="${gy+3}" font-size="9" fill="var(--muted)" font-family="Inter,sans-serif">${val>=1000?Math.round(val/100/1000)+'K':Math.round(val/100)}</text>`;
  }
  let targetLine = '';
  if (targetY){
    targetLine = `<line x1="${padL}" y1="${y(targetY)}" x2="${width-padR}" y2="${y(targetY)}" stroke="var(--gold-muted)" stroke-width="1" stroke-dasharray="2,4"/>`;
  }
  let todayLine = '';
  if (todayIndex!==null && todayIndex>=0){
    todayLine = `<line x1="${x(todayIndex)}" y1="${padT}" x2="${x(todayIndex)}" y2="${height-padB}" stroke="var(--gold-muted)" stroke-width="1" stroke-dasharray="2,3" opacity=".6"/>`;
  }
  const paths = series.map(s => {
    const d = pathFor(s.points);
    if (!d) return '';
    return `<path d="${d}" fill="none" stroke="${s.color}" stroke-width="2" stroke-dasharray="${s.dash||'0'}" stroke-linecap="round" stroke-linejoin="round"/>`;
  }).join('');
  const dots = series.filter(s=>!s.dash).map(s => s.points.map((v,i)=> (v===null||v===undefined) ? '' :
    `<circle cx="${x(i)}" cy="${y(v)}" r="2.4" fill="${s.color}"/>`).join('')).join('');
  const labelEls = labels.map((l,i)=> (i%Math.ceil(n/7||1)===0||i===n-1) ?
    `<text x="${x(i)}" y="${height-4}" font-size="9" fill="var(--muted)" font-family="Inter,sans-serif" text-anchor="middle">${l}</text>` : '').join('');
  // Current-value callout: anchors the chart back to the headline number by marking
  // the actual "today" data point with a small elevated tooltip (month/year + value).
  let calloutSvg = '';
  if (callout && callout.index!==null && callout.index!==undefined && callout.index>=0 && callout.dataValue!==null && callout.dataValue!==undefined){
    const cx = x(callout.index);
    const cy = y(callout.dataValue);
    const boxW = 86, boxH = 34, gapAbove = 12;
    let boxY = cy - gapAbove - boxH;
    if (boxY < padT - 4) boxY = cy + gapAbove; // flip below the point if it would clip the top edge
    let boxX = cx - boxW/2;
    if (boxX < 1) boxX = 1;
    if (boxX + boxW > width-1) boxX = width-1-boxW;
    calloutSvg = `
      <rect x="${boxX}" y="${boxY}" width="${boxW}" height="${boxH}" rx="7" fill="var(--surface-elevated)" stroke="var(--gold-muted)" stroke-width="1"/>
      <text x="${boxX+boxW/2}" y="${boxY+14}" font-size="8.5" fill="var(--muted)" font-family="Inter,sans-serif" text-anchor="middle" letter-spacing=".5">${callout.topLine}</text>
      <text x="${boxX+boxW/2}" y="${boxY+27}" font-size="13" font-weight="700" fill="var(--gold)" font-family="Inter,sans-serif" text-anchor="middle">${callout.bottomLine}</text>
      <circle cx="${cx}" cy="${cy}" r="3.6" fill="var(--ink)" stroke="var(--gold)" stroke-width="2"/>
    `;
  }
  return `<svg width="100%" viewBox="0 0 ${width} ${height}" style="width:100%;height:auto;display:block;">${grid}${targetLine}${todayLine}${paths}${dots}${labelEls}${calloutSvg}</svg>`;
}
function BarChart({ values, labels, width=361, height=170, highlightIndex=null, color='var(--gold-muted)', highlightColor='var(--gold)', format='money' }){
  const padL=34, padR=6, padT=10, padB=18;
  const maxV = Math.max(...values.filter(v=>v!==null), 1);
  const n = values.length;
  const gap = 8;
  const bw = (width - padL - padR - gap*(n-1)) / n;
  const h = height - padT - padB;
  let bars='';
  values.forEach((v,i)=>{
    const bx = padL + i*(bw+gap);
    const bh = v===null ? 0 : (h * v/maxV);
    const by = padT + h - bh;
    const fill = i===highlightIndex ? highlightColor : color;
    const outline = v===null ? `<rect x="${bx}" y="${padT+h-h}" width="${bw}" height="${h}" fill="none" stroke="var(--border)" stroke-width="1" rx="3"/>` : '';
    bars += outline || `<rect x="${bx}" y="${by}" width="${bw}" height="${Math.max(bh,2)}" rx="3" fill="${fill}"/>`;
    bars += `<text x="${bx+bw/2}" y="${height-3}" font-size="9" fill="var(--muted)" text-anchor="middle" font-family="Inter,sans-serif">${labels[i]}</text>`;
  });
  let grid='';
  const gy = padT;
  const axisLabel = format==='money' ? (maxV>=100000?Math.round(maxV/100/1000)+'K':Math.round(maxV/100)) : Math.round(maxV);
  grid = `<line x1="${padL}" y1="${gy}" x2="${width-padR}" y2="${gy}" stroke="var(--border)" stroke-width="1"/>
    <text x="0" y="${gy+3}" font-size="9" fill="var(--muted)" font-family="Inter,sans-serif">${axisLabel}</text>`;
  return `<svg width="100%" viewBox="0 0 ${width} ${height}" style="width:100%;height:auto;display:block;">${grid}${bars}</svg>`;
}
function DonutChart({ segments, size=110, stroke=14 }){
  // segments: [{value,color}]
  const total = segments.reduce((s,x)=>s+x.value,0) || 1;
  const r = (size-stroke)/2, c = 2*Math.PI*r, cx=size/2, cy=size/2;
  let offset = 0, circles='';
  segments.forEach(seg=>{
    const frac = seg.value/total;
    const len = frac*c;
    circles += `<circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="${seg.color}" stroke-width="${stroke}"
      stroke-dasharray="${len} ${c-len}" stroke-dashoffset="${-offset}" stroke-linecap="butt"/>`;
    offset += len;
  });
  return `<svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}" style="width:${size}px;height:${size}px;transform:rotate(-90deg);display:block;">${circles}</svg>`;
}
function Sparkline(values, width=90, height=28, color='var(--gold)'){
  const maxV = Math.max(...values,1), minV = Math.min(...values,0);
  const n = values.length;
  const pts = values.map((v,i)=>{
    const x = n<=1?0:(width*i/(n-1));
    const y = height - (height*(v-minV)/((maxV-minV)||1));
    return `${x.toFixed(1)},${y.toFixed(1)}`;
  }).join(' ');
  return `<svg width="${width}" height="${height}" viewBox="0 0 ${width} ${height}" style="width:${width}px;height:${height}px;display:block;"><polyline points="${pts}" fill="none" stroke="${color}" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>`;
}
function CommandTrajectoryChart({monthCum, projected, labels, todayIndex, currentValue}){
  const width=361, height=150, padL=38, padR=8, padT=18, padB=24;
  const allVals=[...monthCum,...projected].filter(v=>v!==null&&v!==undefined&&Number.isFinite(v));
  const maxV=Math.max(...allVals,1);
  const n=Math.max(labels.length,2);
  const x=i=>padL+(width-padL-padR)*(i/(n-1));
  const y=v=>padT+(height-padT-padB)*(1-(v/maxV));

  const actualPath=monthCum.map((v,i)=>{
    if(v==null || !Number.isFinite(v)) return null;
    const prevValid=i>0 && monthCum[i-1]!=null && Number.isFinite(monthCum[i-1]);
    return `${prevValid?'L':'M'}${x(i).toFixed(1)},${y(v).toFixed(1)}`;
  }).filter(Boolean).join(' ');

  const lastActual=monthCum.reduce((a,v,i)=>(v!=null&&Number.isFinite(v)?i:a),-1);
  const actualPts=monthCum.map((v,i)=>v==null||!Number.isFinite(v)?null:`${x(i).toFixed(1)},${y(v).toFixed(1)}`).filter(Boolean);

  const areaPath=lastActual>=0 && actualPts.length
    ? `M${x(0)},${height-padB} L ${actualPts.join(' L ')} L ${x(lastActual)},${height-padB} Z`
    : '';

  const grid=[];
  const steps=4;
  for(let i=0;i<=steps;i++){
    const val=maxV*(1-i/steps);
    const gy=padT+(height-padT-padB)*(i/steps);
    const label=val>=100000 ? `$${Math.round(val/100000)/10}K`
      : val>=10000 ? `$${Math.round(val/100)/100}K`
      : `$${Math.round(val/100)}`;
    grid.push(
      `<line x1="${padL}" y1="${gy}" x2="${width-padR}" y2="${gy}" stroke="var(--border)" stroke-width="1"/>`,
      `<text x="0" y="${gy+3}" font-size="8.5" fill="var(--muted)" font-family="Inter,sans-serif">${label}</text>`
    );
  }

  const safeTodayIndex=Math.min(Math.max(todayIndex,0),n-1);
  const todayX=x(safeTodayIndex);
  const todayY=Number.isFinite(currentValue) ? y(currentValue) : height-padB;
  const boxW=92, boxH=38;
  let boxX=Math.max(3,Math.min(width-boxW-3,todayX-boxW/2));
  let boxY=Math.max(2,todayY-boxH-12);
  if(boxY<padT) boxY=Math.min(height-padB-boxH,todayY+12);

  const xLabels=labels.map((l,i)=>l
    ? `<text x="${x(i)}" y="${height-5}" font-size="8.5" fill="var(--muted)" font-family="Inter,sans-serif" text-anchor="middle">${l}</text>`
    : ''
  ).join('');

  const dots=monthCum.map((v,i)=>
    v==null||!Number.isFinite(v)?'':`<circle cx="${x(i)}" cy="${y(v)}" r="1.7" fill="var(--gold)"/>`
  ).join('');

  return `<svg width="100%" viewBox="0 0 ${width} ${height}" style="display:block;width:100%;height:auto;overflow:visible;">
    ${grid.join('')}
    ${areaPath?`<path d="${areaPath}" fill="rgba(214,161,58,.10)" stroke="none"/>`:''}
    ${actualPath?`<path d="${actualPath}" fill="none" stroke="var(--gold-light)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>`:''}
    ${dots}
    <line x1="${todayX}" y1="${padT}" x2="${todayX}" y2="${height-padB}" stroke="var(--gold-muted)" stroke-width="1" stroke-dasharray="3 4"/>
    <circle cx="${todayX}" cy="${todayY}" r="4" fill="var(--ink)" stroke="var(--gold-light)" stroke-width="2"/>
    <rect x="${boxX}" y="${boxY}" width="${boxW}" height="${boxH}" rx="7" fill="var(--surface-elevated)" stroke="var(--border)" stroke-width="1"/>
    <text x="${boxX+boxW/2}" y="${boxY+15}" font-size="8.5" fill="var(--secondary)" font-family="Inter,sans-serif" text-anchor="middle">TODAY</text>
    <text x="${boxX+boxW/2}" y="${boxY+30}" font-size="12.5" font-weight="700" fill="var(--gold)" font-family="Inter,sans-serif" text-anchor="middle">${money(currentValue)}</text>
    ${xLabels}
  </svg>`;
}
