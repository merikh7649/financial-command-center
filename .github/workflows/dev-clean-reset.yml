name: Build clean Revolut dev version

on:
  push:
    paths:
      - dev-clean-trigger.txt

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch index.html for isolated dev mode
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path('index.html')
          text = path.read_text()

          replacements = [
              ("const USE_REAL_BANK_IMPORT = true;", "const USE_REAL_BANK_IMPORT = false;"),
              ("const CURRENT_ANNUAL_SALES = 59;", "const CURRENT_ANNUAL_SALES = 0;"),
              ("actualSales:59,", "actualSales:0,"),
              ("const cloudReady = await initCloudSync();", "const cloudReady = false;"),
              ("await initCloudSync();\n        cloudSetStatus('Account created.','success');", "cloudSetStatus('Account created.','success');"),
              ("const ok=await initCloudSync();\n      if(ok) cloudSetStatus('Signed in.','success');", "const ok=false;\n      cloudSetStatus('Signed in.','success');"),
          ]

          for old, new in replacements:
              if old in text:
                  text = text.replace(old, new)

          # Isolate all local financial state under a development-only namespace.
          old_keys = """const KEYS = {
            commissions:'fcc_commissions', expenses:'fcc_expenses', goals:'fcc_goals',
            contributions:'fcc_contributions', activity:'fcc_activity', settings:'fcc_settings',
            salesForecast:'fcc_sales_forecast', actualSales:'fcc_actual_sales',
            monthlySales:'fcc_monthly_sales', reconciliations:'fcc_reconciliations',
            actualSalesEvents:'fcc_actual_sales_events', otherIncome:'fcc_other_income'
          };"""
          new_keys = """const CLEAN_DEV_MODE = true;
          const STORAGE_PREFIX = CLEAN_DEV_MODE ? 'fcc_dev_' : 'fcc_';
          const KEYS = {
            commissions:STORAGE_PREFIX+'commissions', expenses:STORAGE_PREFIX+'expenses', goals:STORAGE_PREFIX+'goals',
            contributions:STORAGE_PREFIX+'contributions', activity:STORAGE_PREFIX+'activity', settings:STORAGE_PREFIX+'settings',
            salesForecast:STORAGE_PREFIX+'sales_forecast', actualSales:STORAGE_PREFIX+'actual_sales',
            monthlySales:STORAGE_PREFIX+'monthly_sales', reconciliations:STORAGE_PREFIX+'reconciliations',
            actualSalesEvents:STORAGE_PREFIX+'actual_sales_events', otherIncome:STORAGE_PREFIX+'other_income'
          };"""
          if old_keys in text:
              text = text.replace(old_keys, new_keys, 1)

          # Remove the old hardcoded imported financial snapshot from this branch.
          start = text.find('const REAL_BANK_IMPORT =')
          marker = '/* ---------------- storage (persists via artifact key-value store; falls back to memory) ---------------- */'
          end = text.find(marker, start)
          if start != -1 and end != -1:
              text = text[:start] + "const REAL_BANK_IMPORT = { commissions:[], expenses:[], other_income:[], reimbursements:[], commission_reversals:[] };\n\n" + text[end:]

          path.write_text(text)
          print('index.html patched for clean isolated development mode')
          PY

      - name: Validate clean dev patch
        run: |
          grep -q 'const USE_REAL_BANK_IMPORT = false;' index.html
          grep -q 'const CURRENT_ANNUAL_SALES = 0;' index.html
          grep -q 'actualSales:0,' index.html
          grep -q "const CLEAN_DEV_MODE = true;" index.html
          grep -q "fcc_dev_" index.html

      - name: Commit clean dev patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f dev-clean-trigger.txt
          git add -A
          if git diff --cached --quiet; then
            echo "No changes needed"
          else
            git commit -m "Create isolated blank financial dev state"
            git push
          fi
