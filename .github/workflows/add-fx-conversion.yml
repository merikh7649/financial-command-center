name: Add MXN FX conversion

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 patch_fx.py
      - run: node --check revolut-live.js
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add revolut-live.js
          if git diff --cached --quiet; then
            echo "No changes needed"
          else
            git commit -m "Convert Revolut balances to MXN"
            git pull --rebase origin main
            git push
          fi
